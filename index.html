<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPImRf4Mp7-AAsTzOXZNgS4NGvENeZsM4",
    authDomain: "elora-parfums.firebaseapp.com",
    projectId: "elora-parfums",
    storageBucket: "elora-parfums.firebasestorage.app",
    messagingSenderId: "953833053006",
    appId: "1:953833053006:web:141e5f4fb22e3a017fdc1f",
    measurementId: "G-YN6WE6QZP7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  window.db = db;
  window.collection = collection;
  window.getDocs = getDocs;
  window.addDoc = addDoc;
  window.query = query;
  window.where = where;
  window.deleteDoc = deleteDoc;
  window.doc = doc;
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elora Parfums | A Essência do Oriente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        elora: { deepblue: '#050B14', gold: '#D4AF37', light: '#FDFBF7' }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body class="antialiased selection:bg-elora-gold selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // COMPONENTE DE PROTEÇÃO: Evita conflito entre React e os Ícones
        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    lucide.createIcons({ root: ref.current });
                }
            }, [name, className]);
            return <span ref={ref} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        // --- MODAL DE AUTENTICAÇÃO ---
        function AuthModal({ onClose, onSuccess, mensagemExtra, darkMode }) {
            const [isRegister, setIsRegister] = useState(true);
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({ nome: '', email: '', telefone: '', cpf: '', senha: '' });

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    if (isRegister) {
                        if (window.db && window.collection && window.query) {
                            const q = window.query(window.collection(window.db, "usuarios"), window.where("email", "==", formData.email));
                            const snapshot = await window.getDocs(q);
                            
                            if (!snapshot.empty) {
                                alert("Este e-mail já possui uma conta cadastrada. Faça login!");
                                setIsRegister(false);
                                setLoading(false);
                                return;
                            }

                            await window.addDoc(window.collection(window.db, "usuarios"), {
                                ...formData,
                                dataCadastro: new Date().toISOString()
                            });
                        }

                        const userObj = { nome: formData.nome, email: formData.email, cpf: formData.cpf, telefone: formData.telefone };
                        localStorage.setItem('elora_user', JSON.stringify(userObj));
                        onSuccess(userObj);
                    } else {
                        if (window.db && window.collection && window.query) {
                            const q = window.query(window.collection(window.db, "usuarios"), window.where("email", "==", formData.email));
                            const snapshot = await window.getDocs(q);
                            
                            if (snapshot.empty) {
                                alert("E-mail não encontrado. Crie uma conta primeiro!");
                                setIsRegister(true);
                                setLoading(false);
                                return;
                            }

                            let userData = null;
                            snapshot.forEach(doc => { userData = doc.data(); });

                            if (userData.senha && userData.senha !== formData.senha) {
                                alert("Senha incorreta!");
                                setLoading(false);
                                return;
                            }

                            const userObj = { nome: userData.nome, email: userData.email, cpf: userData.cpf, telefone: userData.telefone };
                            localStorage.setItem('elora_user', JSON.stringify(userObj));
                            onSuccess(userObj);
                        } else {
                            const userObj = { nome: formData.email.split('@')[0], email: formData.email, cpf: '', telefone: '' };
                            localStorage.setItem('elora_user', JSON.stringify(userObj));
                            onSuccess(userObj);
                        }
                    }
                } catch (err) {
                    console.error(err);
                    alert("Erro ao conectar com o servidor.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-3 sm:p-4 backdrop-blur-md">
                    <div className={`${darkMode ? 'bg-slate-900 text-slate-100 border-slate-800' : 'bg-white text-slate-900 border-slate-200'} border p-6 sm:p-8 max-w-md w-full relative animate-fade-in shadow-2xl rounded-2xl`}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-elora-gold transition-colors">
                            <Icon name="x" className="w-6 h-6" />
                        </button>

                        <div className="text-center mb-6">
                            <Icon name="user" className="w-10 h-10 text-elora-gold mx-auto mb-2" />
                            <h3 className="text-2xl font-serif">{isRegister ? 'Criar Sua Conta' : 'Acessar Sua Conta'}</h3>
                            {mensagemExtra ? (
                                <p className="text-xs text-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 p-2.5 rounded-md mt-2 font-medium">
                                    {mensagemExtra}
                                </p>
                            ) : (
                                <p className="text-xs text-slate-400 mt-1">
                                    {isRegister ? 'Cadastre-se para gerenciar seus pedidos e entregas.' : 'Digite suas credenciais para acessar sua área.'}
                                </p>
                            )}
                        </div>

                        <div className="flex border-b border-slate-200 dark:border-slate-800 mb-6">
                            <button onClick={() => setIsRegister(true)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${isRegister ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400'}`}>Criar Conta</button>
                            <button onClick={() => setIsRegister(false)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${!isRegister ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400'}`}>Já Sou Cliente</button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {isRegister && (
                                <div>
                                    <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Nome Completo *</label>
                                    <input name="nome" value={formData.nome} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="Ex: Maria Silva" />
                                </div>
                            )}

                            <div>
                                <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">E-mail *</label>
                                <input type="email" name="email" value={formData.email} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="seu@email.com" />
                            </div>

                            {isRegister && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">CPF *</label>
                                        <input name="cpf" value={formData.cpf} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="000.000.000-00" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">WhatsApp *</label>
                                        <input name="telefone" value={formData.telefone} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="(11) 99999-9999" />
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Senha *</label>
                                <input type="password" name="senha" value={formData.senha} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="••••••••" />
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-elora-gold text-white py-4 mt-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20 flex items-center justify-center gap-2">
                                {loading ? <Icon name="loader-2" className="w-5 h-5 animate-spin" /> : (isRegister ? 'Cadastrar e Continuar' : 'Entrar na Conta')}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: QUIZ MODAL ---
        function QuizModal({ onClose, produtos, irParaCheckout }) {
            const [step, setStep] = useState(1);
            const [resultado, setResultado] = useState(null);

            const handleResponder = (tipo) => {
                if (step === 1) setStep(2);
                else {
                    const rec = tipo === 'noite' ? produtos[1] : produtos[3]; 
                    setResultado(rec || produtos[0]);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/40 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                    <div className="bg-white border border-slate-200 p-8 md:p-12 max-w-lg w-full relative animate-fade-in shadow-2xl rounded-xl">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-elora-gold transition-colors">
                            <Icon name="x" className="w-6 h-6" />
                        </button>
                        
                        {!resultado ? (
                            <div className="text-center">
                                <Icon name="flask-conical" className="w-12 h-12 text-elora-gold mx-auto mb-6" />
                                <h3 className="text-3xl font-serif text-slate-900 mb-2">Descubra sua Assinatura</h3>
                                <p className="text-slate-500 text-sm mb-8 tracking-widest uppercase">Etapa {step} de 2</p>

                                {step === 1 && (
                                    <div className="animate-fade-in space-y-4">
                                        <p className="text-lg text-slate-700 mb-6 font-medium">Qual atmosfera te atrai mais?</p>
                                        <button onClick={() => handleResponder('madeira')} className="w-full border border-slate-200 hover:border-elora-gold bg-slate-50 py-5 text-sm text-slate-600 hover:text-elora-gold transition-all uppercase tracking-widest font-semibold rounded-md shadow-sm">Madeiras Intensas & Especiarias</button>
                                        <button onClick={() => handleResponder('doce')} className="w-full border border-slate-200 hover:border-elora-gold bg-slate-50 py-5 text-sm text-slate-600 hover:text-elora-gold transition-all uppercase tracking-widest font-semibold rounded-md shadow-sm">Doces Marcantes & Flores</button>
                                    </div>
                                )}
                                {step === 2 && (
                                    <div className="animate-fade-in space-y-4">
                                        <p className="text-lg text-slate-700 mb-6 font-medium">Onde você usará esta joia?</p>
                                        <button onClick={() => handleResponder('noite')} className="w-full border border-slate-200 hover:border-elora-gold bg-slate-50 py-5 text-sm text-slate-600 hover:text-elora-gold transition-all uppercase tracking-widest font-semibold rounded-md shadow-sm">Encontros Noturnos (Sedução)</button>
                                        <button onClick={() => handleResponder('dia')} className="w-full border border-slate-200 hover:border-elora-gold bg-slate-50 py-5 text-sm text-slate-600 hover:text-elora-gold transition-all uppercase tracking-widest font-semibold rounded-md shadow-sm">Eventos Diários (Deixar Rastro)</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="text-center animate-fade-in">
                                <h3 className="text-3xl font-serif text-elora-gold mb-2">Seu Par Perfeito</h3>
                                <p className="text-slate-500 text-sm mb-6">A fragrância ideal para o seu perfil.</p>
                                <div className="bg-slate-50 border border-slate-100 p-6 flex flex-col items-center mb-6 rounded-xl">
                                    <img src={resultado.imagem} className="w-40 h-40 object-cover mb-6 rounded-md shadow-md" alt={resultado.nome} />
                                    <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-2">{resultado.marca}</span>
                                    <h4 className="text-2xl text-slate-900 font-serif">{resultado.nome}</h4>
                                    <p className="text-elora-gold font-medium text-xl mt-3">R$ {resultado.preco.toFixed(2)}</p>
                                </div>
                                <button onClick={() => irParaCheckout(resultado)} className="w-full bg-elora-gold text-white py-5 text-sm font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20">Comprar Esta Joia</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: MINHA CONTA ---
        function CustomerAccount({ user, logout, voltar, darkMode }) {
            const [pedidos, setPedidos] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const buscarPedidos = async () => {
                    if (window.db && window.collection && window.query) {
                        try {
                            const q = window.query(window.collection(window.db, "pedidos"), window.where("cliente.email", "==", user.email));
                            const querySnapshot = await window.getDocs(q);
                            const lista = [];
                            querySnapshot.forEach((doc) => { lista.push({ id: doc.id, ...doc.data() }); });
                            lista.sort((a,b) => new Date(b.dataCriacao) - new Date(a.dataCriacao));
                            setPedidos(lista);
                        } catch (e) { console.error(e); }
                    }
                    setLoading(false);
                };
                buscarPedidos();
            }, [user.email]);

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 md:py-12 animate-fade-in">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 md:mb-12 border-b border-slate-200 dark:border-slate-800 pb-6">
                        <div>
                            <h2 className="text-3xl md:text-4xl font-serif">Minha Conta</h2>
                            <p className="text-slate-400 mt-1 text-sm">Bem-vindo(a), {user.nome.split(' ')[0]}</p>
                        </div>
                        <button onClick={logout} className="flex items-center gap-2 text-red-500 hover:text-red-700 text-xs font-semibold uppercase tracking-widest transition-colors">
                            <Icon name="log-out" className="w-4 h-4" /> Sair
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 space-y-6">
                            <h3 className="text-xl font-serif flex items-center gap-3 mb-6">
                                <Icon name="package" className="w-5 h-5 text-elora-gold" /> Meus Pedidos
                            </h3>
                            
                            {loading ? (
                                <div className="text-center py-12 text-slate-400"><Icon name="loader-2" className="w-8 h-8 animate-spin mx-auto" /></div>
                            ) : pedidos.length === 0 ? (
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-8 rounded-xl text-center shadow-sm`}>
                                    <p className="text-slate-400 mb-4 text-sm">Nenhum pedido encontrado na sua conta.</p>
                                    <button onClick={voltar} className="text-elora-gold font-bold uppercase text-xs tracking-widest hover:underline">Ir para a Loja</button>
                                </div>
                            ) : (
                                pedidos.map(pedido => {
                                    const dataPedido = new Date(pedido.dataCriacao);
                                    const dataEntrega = new Date(dataPedido);
                                    dataEntrega.setDate(dataEntrega.getDate() + 7);

                                    return (
                                        <div key={pedido.id} className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border shadow-lg rounded-xl overflow-hidden`}>
                                            <div className={`${darkMode ? 'bg-slate-800/50 border-slate-800' : 'bg-slate-50 border-slate-100'} border-b p-4 sm:p-5 flex justify-between items-center text-xs`}>
                                                <div>
                                                    <span className="text-slate-400 uppercase tracking-widest font-semibold block text-[10px]">Pedido {pedido.order_nsu}</span>
                                                    <span className="font-medium">{dataPedido.toLocaleDateString('pt-BR')}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-slate-400 uppercase tracking-widest font-semibold block text-[10px]">Status</span>
                                                    <span className="font-bold text-elora-gold bg-elora-gold/10 px-2.5 py-1 rounded-full text-[11px]">{pedido.status || 'Aguardando Pagamento'}</span>
                                                </div>
                                            </div>
                                            <div className="p-4 sm:p-6 flex flex-col sm:flex-row gap-4 sm:gap-6 items-center">
                                                <div className="bg-slate-100 dark:bg-slate-800 w-20 h-20 sm:w-24 sm:h-24 rounded-md flex items-center justify-center flex-shrink-0">
                                                    <Icon name="flask-conical" className="w-8 h-8 sm:w-10 sm:h-10 text-slate-400" />
                                                </div>
                                                <div className="flex-grow text-center sm:text-left">
                                                    <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-1">{pedido.produto.marca}</span>
                                                    <h4 className="text-base sm:text-lg font-serif">{pedido.produto.nome}</h4>
                                                    <p className="text-slate-400 font-medium text-sm mt-1">R$ {pedido.produto.preco.toFixed(2)}</p>
                                                </div>
                                                <div className="w-full sm:w-auto border-t sm:border-t-0 sm:border-l border-slate-200 dark:border-slate-800 pt-3 sm:pt-0 sm:pl-6 text-center sm:text-left">
                                                    <div className="flex items-center justify-center sm:justify-start gap-1.5 text-emerald-500 mb-1">
                                                        <Icon name="truck" className="w-4 h-4" />
                                                        <span className="text-[10px] font-bold uppercase tracking-widest">Entrega Prevista</span>
                                                    </div>
                                                    <p className="text-xs sm:text-sm font-semibold">{dataEntrega.toLocaleDateString('pt-BR')}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>

                        <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 h-fit shadow-xl rounded-xl`}>
                            <h3 className="text-xl font-serif flex items-center gap-3 mb-6">
                                <Icon name="user" className="w-5 h-5 text-elora-gold" /> Dados Cadastrais
                            </h3>
                            <div className="space-y-4 text-xs sm:text-sm text-slate-400">
                                <div>
                                    <span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">Nome</span>
                                    <p className="font-medium text-slate-200 dark:text-slate-100">{user.nome}</p>
                                </div>
                                <div>
                                    <span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">E-mail</span>
                                    <p className="font-medium text-slate-200 dark:text-slate-100">{user.email}</p>
                                </div>
                                <div>
                                    <span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">CPF</span>
                                    <p className="font-medium text-slate-200 dark:text-slate-100">{user.cpf || 'Não informado'}</p>
                                </div>
                                <div>
                                    <span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">WhatsApp</span>
                                    <p className="font-medium text-slate-200 dark:text-slate-100">{user.telefone || 'Não informado'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: CHECKOUT (ENDEREÇO DE ENTREGA) ---
        function Checkout({ produto, user, voltarParaLoja, darkMode }) {
            const [loading, setLoading] = useState(false);
            const [endereco, setEndereco] = useState({
                cep: '', rua: '', numero: '', complemento: '', bairro: '', cidade: '', uf: 'SP'
            });

            const handleChange = (e) => setEndereco({ ...endereco, [e.target.name]: e.target.value });

            const processarPedido = async (e) => {
                e.preventDefault();
                setLoading(true);

                const orderNsu = "ELORA-" + Date.now();
                const precoCentavos = Math.round(produto.preco * 100);

                const clienteCompleto = {
                    nome: user.nome, email: user.email, cpf: user.cpf, telefone: user.telefone, ...endereco
                };

                try {
                    if (window.db && window.collection && window.addDoc) {
                        await window.addDoc(window.collection(window.db, "pedidos"), {
                            order_nsu: orderNsu, cliente: clienteCompleto, 
                            produto: { id: produto.id, nome: produto.nome, marca: produto.marca, preco: produto.preco },
                            dataCriacao: new Date().toISOString(), status: "Aguardando Pagamento"
                        });
                    }
                } catch (err) { console.error(err); }

                const pedido = {
                    order_nsu: orderNsu,
                    customer: clienteCompleto,
                    items: [ { quantity: 1, price: precoCentavos, description: `Elora Parfums: ${produto.marca} - ${produto.nome}` } ]
                };

                try {
                    const resposta = await fetch('/api/checkout', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pedido)
                    });
                    const dados = await resposta.json();
                    if (dados.url || dados.checkout_url) window.location.href = dados.url || dados.checkout_url;
                    else setLoading(false);
                } catch (erro) {
                    alert("Erro ao conectar com o checkout. Tente novamente.");
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 lg:py-16 grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 animate-fade-in">
                    <div>
                        <button onClick={voltarParaLoja} className="flex items-center gap-2 text-slate-400 hover:text-elora-gold mb-6 text-xs uppercase tracking-widest font-semibold transition-colors">
                            <Icon name="arrow-left" className="w-4 h-4" /> Voltar
                        </button>

                        <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl mb-6 flex items-center gap-3">
                            <Icon name="shield-check" className="w-5 h-5 text-emerald-500 flex-shrink-0" />
                            <div>
                                <p className="text-[11px] text-slate-400 font-medium">Cliente Autenticado:</p>
                                <p className="text-xs font-bold">{user.nome} ({user.email})</p>
                            </div>
                        </div>

                        <form onSubmit={processarPedido} className="space-y-6">
                            <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 shadow-xl rounded-xl`}>
                                <h3 className="text-xl font-serif mb-6 flex items-center gap-3">
                                    <Icon name="map-pin" className="text-elora-gold w-5 h-5" /> Endereço de Entrega
                                </h3>
                                
                                <div className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">CEP *</label>
                                            <input name="cep" value={endereco.cep} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="00000-000" />
                                        </div>
                                        <div className="sm:col-span-2">
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Rua / Avenida *</label>
                                            <input name="rua" value={endereco.rua} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="Nome da rua" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Número *</label>
                                            <input name="numero" value={endereco.numero} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="123" />
                                        </div>
                                        <div className="sm:col-span-2">
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Complemento</label>
                                            <input name="complemento" value={endereco.complemento} onChange={handleChange} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="Apto, Bloco, etc." />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Bairro *</label>
                                            <input name="bairro" value={endereco.bairro} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Cidade *</label>
                                            <input name="cidade" value={endereco.cidade} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Estado *</label>
                                            <input name="uf" value={endereco.uf} onChange={handleChange} required maxLength="2" className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md uppercase`} placeholder="SP" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-elora-gold text-white py-4 text-xs sm:text-sm font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-xl shadow-elora-gold/20 flex items-center justify-center gap-3">
                                {loading ? <Icon name="loader-2" className="w-5 h-5 animate-spin" /> : 'Confirmar Endereço e Pagar'}
                            </button>
                        </form>
                    </div>
                    
                    <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-10 h-fit shadow-2xl rounded-xl relative overflow-hidden lg:sticky lg:top-28`}>
                        <h3 className="text-xl sm:text-2xl font-serif mb-6">Resumo do Pedido</h3>
                        
                        <div className="bg-emerald-500/10 border border-emerald-500/20 p-3.5 rounded-lg flex items-center gap-3 mb-6">
                            <Icon name="sparkles" className="w-5 h-5 text-emerald-500 flex-shrink-0" />
                            <p className="text-xs text-emerald-600 dark:text-emerald-400 font-medium">
                                <strong>Ganhe 5% OFF no PIX!</strong> Aplicado automaticamente na etapa de pagamento.
                            </p>
                        </div>

                        <div className="flex items-center gap-4 sm:gap-6 mb-6 pb-6 border-b border-slate-200 dark:border-slate-800">
                            <img src={produto.imagem} className="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-md shadow-md" alt={produto.nome} />
                            <div>
                                <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-1">{produto.marca}</span>
                                <p className="text-base sm:text-lg font-serif mb-1">{produto.nome}</p>
                                <p className="text-slate-400 font-medium text-xs sm:text-sm">R$ {produto.preco.toFixed(2)}</p>
                            </div>
                        </div>

                        <div className="space-y-3 text-xs sm:text-sm text-slate-400">
                            <div className="flex justify-between"><span>Subtotal</span><span>R$ {produto.preco.toFixed(2)}</span></div>
                            <div className="flex justify-between"><span>Frete Expresso</span><span className="text-emerald-500 font-semibold">Grátis</span></div>
                        </div>

                        <div className="flex justify-between font-serif text-2xl sm:text-3xl mt-6 pt-6 border-t border-slate-200 dark:border-slate-800">
                            <span>Total</span><span className="text-elora-gold">R$ {produto.preco.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- PAINEL ADMIN ---
        function AdminDashboard({ produtos, setProdutos, darkMode }) {
            const [novoProduto, setNovoProduto] = useState({ nome: '', marca: '', preco: '', estoque: '', categoria: 'Masculino', imagem: '' });
            const [carregando, setCarregando] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setCarregando(true);
                
                const produtoCriado = {
                    nome: novoProduto.nome,
                    marca: novoProduto.marca,
                    preco: parseFloat(novoProduto.preco),
                    estoque: parseInt(novoProduto.estoque),
                    categoria: novoProduto.categoria || 'Masculino',
                    genero: novoProduto.categoria || 'Masculino',
                    imagem: novoProduto.imagem || './royal-amber.jpeg',
                    tag: 'Oficial'
                };

                try {
                    if (window.db && window.collection && window.addDoc) {
                        const docRef = await window.addDoc(window.collection(window.db, "perfumes"), produtoCriado);
                        setProdutos([...produtos, { ...produtoCriado, id: docRef.id }]);
                        alert("Perfume oficial cadastrado no Firebase!");
                    }
                } catch (error) { console.error(error); }

                setNovoProduto({ nome: '', marca: '', preco: '', estoque: '', categoria: 'Masculino', imagem: '' });
                setCarregando(false);
            };

            const limparPedidos = async () => {
                if (!confirm("Deseja APAGAR TODOS os pedidos de teste salvos no banco?")) return;
                try {
                    if (window.db && window.collection && window.getDocs && window.deleteDoc && window.doc) {
                        const qs = await window.getDocs(window.collection(window.db, "pedidos"));
                        for (const d of qs.docs) {
                            await window.deleteDoc(window.doc(window.db, "pedidos", d.id));
                        }
                        alert("Todos os pedidos de teste foram apagados com sucesso!");
                    }
                } catch (e) { alert("Erro ao apagar pedidos: " + e.message); }
            };

            const limparPerfumes = async () => {
                if (!confirm("Deseja ZERAR todos os perfumes de teste para começar do zero oficial?")) return;
                try {
                    if (window.db && window.collection && window.getDocs && window.deleteDoc && window.doc) {
                        const qs = await window.getDocs(window.collection(window.db, "perfumes"));
                        for (const d of qs.docs) {
                            await window.deleteDoc(window.doc(window.db, "perfumes", d.id));
                        }
                        setProdutos([]);
                        alert("Catálogo zerado! Você já pode cadastrar as fragrâncias oficiais.");
                    }
                } catch (e) { alert("Erro ao zerar perfumes: " + e.message); }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 md:py-12 animate-fade-in">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
                        <div className="flex items-center gap-3">
                            <Icon name="layout-dashboard" className="text-elora-gold w-8 h-8" />
                            <div>
                                <h2 className="text-2xl sm:text-3xl font-serif">Painel Oficial de Gestão</h2>
                                <p className="text-xs text-slate-400 mt-1">Elora Parfums Admin</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-3">
                            <button onClick={limparPedidos} className="bg-red-500/10 text-red-500 hover:bg-red-500/20 border border-red-500/30 px-4 py-2.5 rounded-md text-xs font-bold uppercase tracking-widest flex items-center gap-2 transition-colors">
                                <Icon name="trash-2" className="w-4 h-4" /> Limpar Pedidos Teste
                            </button>
                            <button onClick={limparPerfumes} className="bg-amber-500/10 text-amber-500 hover:bg-amber-500/20 border border-amber-500/30 px-4 py-2.5 rounded-md text-xs font-bold uppercase tracking-widest flex items-center gap-2 transition-colors">
                                <Icon name="trash-2" className="w-4 h-4" /> Zerar Perfumes
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 h-fit rounded-xl shadow-xl`}>
                            <h3 className="text-lg font-serif mb-6 flex items-center gap-2">
                                <Icon name="plus-circle" className="w-5 h-5 text-elora-gold" /> Cadastrar Fragrância
                            </h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Nome</label>
                                    <input value={novoProduto.nome} onChange={(e) => setNovoProduto({...novoProduto, nome: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required />
                                </div>
                                <div>
                                    <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Marca</label>
                                    <input value={novoProduto.marca} onChange={(e) => setNovoProduto({...novoProduto, marca: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Preço (R$)</label>
                                        <input type="number" step="0.01" value={novoProduto.preco} onChange={(e) => setNovoProduto({...novoProduto, preco: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Estoque</label>
                                        <input type="number" value={novoProduto.estoque} onChange={(e) => setNovoProduto({...novoProduto, estoque: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Arquivo da foto (ex: ./asad.jpeg)</label>
                                    <input value={novoProduto.imagem} onChange={(e) => setNovoProduto({...novoProduto, imagem: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} placeholder="./royal-amber.jpeg" />
                                </div>
                                <button type="submit" disabled={carregando} className="w-full bg-elora-gold text-white py-3.5 text-xs font-bold uppercase tracking-widest mt-4 hover:bg-slate-900 transition-colors rounded-md shadow-md">
                                    {carregando ? 'Salvando...' : 'Cadastrar no Firebase'}
                                </button>
                            </form>
                        </div>

                        <div className={`lg:col-span-2 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 rounded-xl shadow-xl`}>
                            <h3 className="text-lg font-serif mb-6 flex items-center gap-2">
                                <Icon name="package" className="w-5 h-5 text-elora-gold" /> Fragrâncias Oficiais
                            </h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs sm:text-sm text-slate-400">
                                    <thead>
                                        <tr className="border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-widest">
                                            <th className="pb-3 font-semibold">Produto</th>
                                            <th className="pb-3 font-semibold">Preço</th>
                                            <th className="pb-3 font-semibold text-right">Qtd</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {produtos.length === 0 ? (
                                            <tr><td colSpan="3" className="py-8 text-center text-slate-500 text-xs">Nenhum perfume cadastrado.</td></tr>
                                        ) : (
                                            produtos.map(p => (
                                                <tr key={p.id} className="border-b border-slate-100 dark:border-slate-800/50">
                                                    <td className="py-4">
                                                        <span className="text-elora-gold text-[9px] uppercase font-bold block tracking-widest">{p.marca}</span>
                                                        <span className="font-medium text-slate-200">{p.nome}</span>
                                                    </td>
                                                    <td className="py-4 font-medium">R$ {Number(p.preco).toFixed(2)}</td>
                                                    <td className="py-4 text-right"><span className="px-2.5 py-1 text-[11px] font-semibold rounded bg-slate-800 text-slate-300">{p.estoque} un.</span></td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE PRINCIPAL APP ---
        function App() {
            const [view, setView] = useState('store');
            const [quizOpen, setQuizOpen] = useState(false);
            const [authModalOpen, setAuthModalOpen] = useState(false);
            const [authNotice, setAuthNotice] = useState('');
            const [produtos, setProdutos] = useState([]); 
            const [produtoCheckout, setProdutoCheckout] = useState(null);
            
            const [darkMode, setDarkMode] = useState(false);

            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('elora_user');
                return saved ? JSON.parse(saved) : null;
            });

            useEffect(() => {
                const carregarPerfumes = async () => {
                    setTimeout(async () => {
                        if (window.db && window.collection && window.getDocs) {
                            try {
                                const qs = await window.getDocs(window.collection(window.db, "perfumes"));
                                const lista = [];
                                qs.forEach(doc => lista.push({ id: doc.id, ...doc.data() }));
                                setProdutos(lista);
                            } catch (e) { setProdutos([]); }
                        } else setProdutos([]);
                    }, 800);
                };
                carregarPerfumes();
            }, []);

            const logout = () => {
                localStorage.removeItem('elora_user');
                setUser(null);
                setView('store');
            };

            const handleComprar = (produto) => {
                setProdutoCheckout(produto);
                if (!user) {
                    setAuthNotice('Crie sua conta para prosseguir com a compra.');
                    setAuthModalOpen(true);
                } else {
                    setView('checkout');
                    window.scrollTo(0,0);
                }
            };

            const handleAuthSuccess = (loggedUser) => {
                setUser(loggedUser);
                setAuthModalOpen(false);
                setAuthNotice('');

                if (produtoCheckout) {
                    setView('checkout');
                    window.scrollTo(0,0);
                } else {
                    setView('account');
                }
            };

            return (
                <div className={`min-h-screen font-sans flex flex-col transition-colors duration-300 ${darkMode ? 'bg-slate-950 text-slate-100 dark' : 'bg-[#FDFBF7] text-slate-900'}`}>
                    <header className={`${darkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'} backdrop-blur-md border-b py-4 md:py-6 sticky top-0 z-50 shadow-sm transition-colors`}>
                        <div className="max-w-7xl w-full mx-auto px-4 flex justify-between items-center relative">
                            
                            <div className="w-1/3 flex items-center gap-3">
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-elora-gold transition-colors flex items-center gap-2 text-xs">
                                    <Icon name={darkMode ? "sun" : "moon"} className={`w-4 h-4 ${darkMode ? 'text-amber-400' : ''}`} />
                                    <span className="hidden md:inline font-semibold uppercase tracking-wider text-[10px]">{darkMode ? 'Claro' : 'Escuro'}</span>
                                </button>
                                <button onClick={() => setView('admin')} className="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-elora-gold hidden lg:block">Admin</button>
                            </div>

                            <div className="text-3xl sm:text-4xl md:text-5xl font-cinzel tracking-[0.15em] uppercase text-elora-gold absolute left-1/2 -translate-x-1/2 cursor-pointer flex flex-col items-center leading-none" onClick={() => setView('store')}>
                                <span className="font-semibold drop-shadow-sm pb-1">ELORA</span>
                                <span className="text-[9px] sm:text-[10px] tracking-[0.4em] font-sans text-slate-900 dark:text-slate-100 font-medium">PARFUMS</span>
                            </div>

                            <div className="flex items-center justify-end space-x-4 w-1/3">
                                <button onClick={() => {
                                    if (user) setView('account');
                                    else { setAuthNotice(''); setAuthModalOpen(true); }
                                }} className="flex items-center gap-2 text-[10px] sm:text-[11px] font-bold uppercase tracking-[0.15em] text-slate-500 dark:text-slate-300 hover:text-elora-gold transition-colors py-1">
                                    <Icon name="user" className="w-4 h-4 sm:w-5 sm:h-5" />
                                    <span className="hidden sm:inline">{user ? 'Minha Conta' : 'Entrar'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'admin' && <AdminDashboard produtos={produtos} setProdutos={setProdutos} darkMode={darkMode} />}
                        {view === 'account' && user && <CustomerAccount user={user} logout={logout} voltar={() => setView('store')} darkMode={darkMode} />}
                        {view === 'checkout' && produtoCheckout && user && <Checkout produto={produtoCheckout} user={user} voltarParaLoja={() => setView('store')} darkMode={darkMode} />}
                        
                        {view === 'store' && (
                            <div className="animate-fade-in">
                                <section className="relative h-[65vh] sm:h-[80vh] w-full flex items-center justify-center overflow-hidden bg-slate-900">
                                    <img src="./banner-promo.jpeg" className="absolute inset-0 w-full h-full object-cover z-0 opacity-80" alt="Banner Promoção" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent z-10"></div>
                                    <div className="relative z-20 text-center px-4 mt-8 max-w-4xl">
                                        <h1 className="text-4xl sm:text-6xl md:text-8xl font-serif mb-4 sm:mb-6 text-white tracking-tight drop-shadow-2xl">
                                            A Essência do <span className="text-elora-gold">Oriente</span>.
                                        </h1>
                                        <p className="text-sm sm:text-lg text-slate-200 mb-8 max-w-2xl mx-auto font-medium drop-shadow">
                                            Fragrâncias árabes exclusivas e refinadas.
                                        </p>
                                        <button onClick={() => setQuizOpen(true)} className="bg-elora-gold text-white px-6 sm:px-10 py-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-all shadow-2xl flex items-center mx-auto gap-2.5 rounded-md hover:scale-105">
                                            <Icon name="flask-conical" className="w-4 h-4" /> Encontrar Minha Fragrância
                                        </button>
                                    </div>
                                </section>

                                <section className="max-w-7xl mx-auto px-4 py-16 sm:py-24">
                                    <h2 className="text-3xl sm:text-5xl font-serif mb-12 sm:mb-16 text-center">Catálogo Exclusivo</h2>
                                    
                                    {produtos.length === 0 ? (
                                        <div className="text-center py-16 border border-dashed border-slate-300 dark:border-slate-800 rounded-2xl p-8">
                                            <Icon name="sparkles" className="w-12 h-12 text-elora-gold mx-auto mb-4 opacity-80" />
                                            <h3 className="text-2xl font-serif mb-2">Catálogo Oficial em Preparação</h3>
                                            <p className="text-xs sm:text-sm text-slate-400 max-w-md mx-auto mb-6">
                                                O banco de dados foi zerado para o lançamento oficial. Acesse o painel Admin para cadastrar os produtos reais da Elora Parfums.
                                            </p>
                                            <button onClick={() => setView('admin')} className="bg-elora-gold text-white px-6 py-3 text-xs font-bold uppercase tracking-widest rounded-md hover:bg-slate-900 transition-colors">
                                                Ir para Painel Admin
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 sm:gap-8">
                                            {produtos.map((produto) => (
                                                <div key={produto.id} className={`group flex flex-col ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border shadow-lg hover:shadow-2xl hover:border-elora-gold/30 transition-all duration-500 p-4 sm:p-5 rounded-xl`}>
                                                    <div className="relative aspect-[4/5] bg-slate-50 dark:bg-slate-800 overflow-hidden flex items-center justify-center p-4 mb-5 rounded-md">
                                                        {produto.tag && <div className="absolute top-3 left-3 bg-elora-gold text-white text-[9px] font-bold uppercase tracking-widest px-2.5 py-1 z-10 rounded-sm shadow-sm">{produto.tag}</div>}
                                                        <img src={produto.imagem} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 rounded-md shadow-sm" alt={produto.nome} />
                                                    </div>
                                                    <div className="text-center mt-auto flex flex-col items-center">
                                                        <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest mb-1.5 block">{produto.marca}</span>
                                                        <h3 className="text-lg font-serif mb-2 group-hover:text-elora-gold transition-colors">{produto.nome}</h3>
                                                        <p className="text-slate-400 mb-5 font-medium text-base">R$ {Number(produto.preco).toFixed(2)}</p>
                                                        
                                                        <button onClick={() => handleComprar(produto)} className="w-full border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 py-3.5 text-xs font-bold uppercase tracking-widest hover:bg-elora-gold hover:border-elora-gold hover:text-white transition-all rounded-md flex justify-center items-center gap-2">
                                                            <Icon name="shopping-bag" className="w-4 h-4" /> Comprar
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>
                            </div>
                        )}
                    </main>

                    <footer className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} border-t py-10 mt-auto text-center transition-colors`}>
                        <div className="text-2xl sm:text-3xl font-cinzel tracking-[0.2em] uppercase text-elora-gold mb-4 leading-none">
                            ELORA <span className="text-slate-900 dark:text-slate-100 text-[9px] font-sans tracking-[0.4em] block mt-2">PARFUMS</span>
                        </div>
                        <p className="text-slate-400 text-xs tracking-wide">Todos os direitos reservados &copy; 2026.</p>
                    </footer>

                    {quizOpen && <QuizModal onClose={() => setQuizOpen(false)} produtos={produtos} irParaCheckout={(p) => handleComprar(p)} />}
                    {authModalOpen && <AuthModal onClose={() => setAuthModalOpen(false)} onSuccess={handleAuthSuccess} mensagemExtra={authNotice} darkMode={darkMode} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
