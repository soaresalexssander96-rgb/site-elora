<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, query, where, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  // NOVA IMPORTAÇÃO: Firebase Storage para upload de imagens
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPImRf4Mp7-AAsTzOXZNgS4NGvENeZsM4",
    authDomain: "elora-parfums.firebaseapp.com",
    projectId: "elora-parfums",
    storageBucket: "elora-parfums.firebasestorage.app",
    messagingSenderId: "953833053006",
    appId: "1:953833053006:web:141e5f4fb22e3a017fdc1f",
    measurementId: "G-YN6WE6QZP7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);
  
  window.db = db;
  window.collection = collection;
  window.getDocs = getDocs;
  window.addDoc = addDoc;
  window.query = query;
  window.where = where;
  window.deleteDoc = deleteDoc;
  window.updateDoc = updateDoc;
  window.doc = doc;
  
  // Disponibilizando o Storage para o React
  window.storage = storage;
  window.storageRef = storageRef;
  window.uploadBytes = uploadBytes;
  window.getDownloadURL = getDownloadURL;
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elora Parfums | A Essência do Oriente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        elora: { deepblue: '#050B14', gold: '#D4AF37', light: '#FDFBF7', darkbg: '#0B1320' }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
        
        .logo-parfums-line { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo-parfums-line::before, .logo-parfums-line::after { content: ""; display: block; width: 25px; height: 1px; background-color: #D4AF37; }
    </style>
</head>
<body class="antialiased selection:bg-elora-gold selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    lucide.createIcons({ root: ref.current });
                }
            }, [name, className]);
            return <span ref={ref} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        // --- COMPONENTE: BOTÃO WHATSAPP ---
        function WhatsAppButton() {
            const telefone = "5551994378685"; 
            const mensagem = encodeURIComponent("Olá, Elora Parfums! Preciso de ajuda no site.");
            return (
                <a href={`https://wa.me/${telefone}?text=${mensagem}`} target="_blank" rel="noreferrer" 
                   className="fixed bottom-6 right-6 bg-green-500 text-white p-4 rounded-full shadow-2xl hover:bg-green-600 transition-colors z-50 flex items-center justify-center hover:scale-110">
                    <Icon name="message-circle" className="w-6 h-6" />
                </a>
            );
        }

        // --- COMPONENTE: LOGÓTIPO PREMIUM ---
        function LogoPremium({ onClick, isSmall = false }) {
            return (
                <div className={`font-cinzel cursor-pointer flex flex-col items-center leading-none ${isSmall ? 'scale-75' : ''}`} onClick={onClick}>
                    <span className="text-3xl sm:text-4xl md:text-5xl tracking-[0.15em] uppercase text-elora-gold font-semibold drop-shadow-sm pb-1">
                        ELORA
                    </span>
                    <div className="logo-parfums-line">
                        <span className="text-[10px] sm:text-[12px] tracking-[0.3em] font-serif text-elora-gold font-medium uppercase">
                            Parfums
                        </span>
                    </div>
                </div>
            );
        }

        // --- MODAL DO QUIZ ---
        function QuizModal({ onClose, produtos, irParaCheckout, darkMode }) {
            const [step, setStep] = useState(1);
            const [resultado, setResultado] = useState(null);

            const handleResponder = (tipo) => {
                if (step === 1) setStep(2);
                else {
                    const rec = tipo === 'noite' ? produtos[1] : produtos[0]; 
                    setResultado(rec || produtos[0]);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                    <div className={`${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'} border p-8 md:p-12 max-w-lg w-full relative animate-fade-in shadow-2xl rounded-xl`}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-elora-gold transition-colors">
                            <Icon name="x" className="w-6 h-6" />
                        </button>
                        
                        {!resultado ? (
                            <div className="text-center">
                                <Icon name="flask-conical" className="w-12 h-12 text-elora-gold mx-auto mb-6" />
                                <h3 className="text-3xl font-serif mb-2">Descubra sua Assinatura</h3>
                                <p className="text-slate-500 text-sm mb-8 tracking-widest uppercase">Etapa {step} de 2</p>

                                {step === 1 && (
                                    <div className="animate-fade-in space-y-4">
                                        <p className="text-lg text-slate-500 mb-6 font-medium">Qual atmosfera te atrai mais?</p>
                                        <button onClick={() => handleResponder('madeira')} className={`w-full border ${darkMode ? 'border-slate-800 bg-slate-800 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'} hover:border-elora-gold hover:text-elora-gold py-5 text-sm transition-all uppercase tracking-widest font-semibold rounded-md`}>Madeiras & Especiarias</button>
                                        <button onClick={() => handleResponder('doce')} className={`w-full border ${darkMode ? 'border-slate-800 bg-slate-800 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'} hover:border-elora-gold hover:text-elora-gold py-5 text-sm transition-all uppercase tracking-widest font-semibold rounded-md`}>Doces & Flores</button>
                                    </div>
                                )}
                                {step === 2 && (
                                    <div className="animate-fade-in space-y-4">
                                        <p className="text-lg text-slate-500 mb-6 font-medium">Onde usará esta joia?</p>
                                        <button onClick={() => handleResponder('noite')} className={`w-full border ${darkMode ? 'border-slate-800 bg-slate-800 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'} hover:border-elora-gold hover:text-elora-gold py-5 text-sm transition-all uppercase tracking-widest font-semibold rounded-md`}>Encontros Noturnos</button>
                                        <button onClick={() => handleResponder('dia')} className={`w-full border ${darkMode ? 'border-slate-800 bg-slate-800 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'} hover:border-elora-gold hover:text-elora-gold py-5 text-sm transition-all uppercase tracking-widest font-semibold rounded-md`}>Eventos Diários</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="text-center animate-fade-in">
                                <h3 className="text-3xl font-serif text-elora-gold mb-2">Seu Par Perfeito</h3>
                                <p className="text-slate-500 text-sm mb-6">A fragrância ideal para o seu perfil.</p>
                                <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-100'} border p-6 flex flex-col items-center mb-6 rounded-xl`}>
                                    <img src={resultado.imagem} className="w-40 h-40 object-cover mb-6 rounded-md shadow-md" alt={resultado.nome} />
                                    <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-2">{resultado.marca}</span>
                                    <h4 className="text-2xl font-serif">{resultado.nome}</h4>
                                    <p className="text-elora-gold font-medium text-xl mt-3">R$ {resultado.preco.toFixed(2)}</p>
                                </div>
                                <button onClick={() => irParaCheckout(resultado)} className="w-full bg-elora-gold text-white py-5 text-sm font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20">
                                    Adicionar à Sacola
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- MODAL DE DETALHES DO PRODUTO ---
        function ProductModal({ produto, onClose, onAddToCart, darkMode }) {
            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                    <div className={`${darkMode ? 'bg-slate-900 text-slate-100 border-slate-800' : 'bg-white text-slate-900 border-slate-200'} border p-6 sm:p-8 max-w-2xl w-full relative animate-fade-in shadow-2xl rounded-2xl flex flex-col sm:flex-row gap-8`}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-elora-gold transition-colors z-10">
                            <Icon name="x" className="w-6 h-6" />
                        </button>
                        
                        <div className={`w-full sm:w-1/2 flex items-center justify-center ${darkMode ? 'bg-slate-800' : 'bg-slate-50'} rounded-xl p-4`}>
                            <img src={produto.imagem} alt={produto.nome} className="w-full max-h-64 object-contain rounded-md" />
                        </div>
                        
                        <div className="w-full sm:w-1/2 flex flex-col justify-center">
                            <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest mb-1">{produto.marca}</span>
                            <h2 className="text-3xl font-serif mb-2">{produto.nome}</h2>
                            <p className="text-2xl font-medium mb-6">R$ {Number(produto.preco).toFixed(2)}</p>
                            
                            {produto.estoque < 3 && (
                                <p className="text-xs text-red-500 font-bold uppercase tracking-widest mb-4 flex items-center gap-1">
                                    <Icon name="alert-circle" className="w-4 h-4" /> Últimas Unidades
                                </p>
                            )}

                            <div className="space-y-4 mb-8 text-sm text-slate-500 dark:text-slate-400">
                                <p>Uma experiência luxuosa, com excelente fixação e projeção marcante, ideal para quem deseja deixar rastro.</p>
                            </div>

                            <button onClick={() => { onAddToCart(produto); onClose(); }} className="w-full bg-elora-gold text-white py-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20 flex items-center justify-center gap-2">
                                <Icon name="shopping-cart" className="w-4 h-4" /> Adicionar à Sacola
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- CARRINHO DE COMPRAS LATERAL ---
        function CartSidebar({ isOpen, onClose, cart, removeFromCart, onCheckout, darkMode }) {
            if (!isOpen) return null;
            const total = cart.reduce((sum, item) => sum + item.preco, 0);

            return (
                <div className="fixed inset-0 z-[100] flex justify-end">
                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className={`${darkMode ? 'bg-slate-900 text-slate-100 border-l-slate-800' : 'bg-white text-slate-900 border-l-slate-200'} w-full sm:w-96 h-full relative z-10 flex flex-col animate-slide-in-right border-l shadow-2xl`}>
                        
                        <div className="flex items-center justify-between p-6 border-b border-slate-200 dark:border-slate-800">
                            <h2 className="text-xl font-serif flex items-center gap-2">
                                <Icon name="shopping-bag" className="w-5 h-5 text-elora-gold" /> Sua Sacola
                            </h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-elora-gold transition-colors">
                                <Icon name="x" className="w-6 h-6" />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            {cart.length === 0 ? (
                                <div className="text-center text-slate-400 py-12">Sua sacola está vazia.</div>
                            ) : (
                                cart.map((item, index) => (
                                    <div key={index} className="flex gap-4 items-center">
                                        <img src={item.imagem} alt={item.nome} className="w-16 h-16 object-cover rounded-md bg-slate-100 dark:bg-slate-800" />
                                        <div className="flex-1">
                                            <p className="font-serif text-sm">{item.nome}</p>
                                            <p className="text-xs text-slate-500 dark:text-slate-400">{item.marca}</p>
                                            <p className="font-medium text-sm mt-1">R$ {item.preco.toFixed(2)}</p>
                                        </div>
                                        <button onClick={() => removeFromCart(index)} className="text-red-400 hover:text-red-600 p-2">
                                            <Icon name="trash-2" className="w-4 h-4" />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>

                        {cart.length > 0 && (
                            <div className="p-6 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                                <div className="flex justify-between font-serif text-xl mb-6">
                                    <span>Subtotal</span>
                                    <span className="text-elora-gold">R$ {total.toFixed(2)}</span>
                                </div>
                                <button onClick={onCheckout} className="w-full bg-elora-gold text-white py-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20">
                                    Finalizar Compra
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- MODAL DE AUTENTICAÇÃO ---
        function AuthModal({ onClose, onSuccess, mensagemExtra, darkMode }) {
            const [isRegister, setIsRegister] = useState(true);
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({ nome: '', email: '', telefone: '', cpf: '', senha: '' });

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    if (!isRegister && formData.email === 'admin' && formData.senha === 'elora2026') {
                        const adminUser = { nome: 'Administrador', email: 'admin', role: 'admin', cpf: '', telefone: '' };
                        localStorage.setItem('elora_user', JSON.stringify(adminUser));
                        onSuccess(adminUser);
                        return;
                    }

                    if (isRegister) {
                        if (window.db && window.collection && window.query) {
                            const q = window.query(window.collection(window.db, "usuarios"), window.where("email", "==", formData.email));
                            const snapshot = await window.getDocs(q);
                            if (!snapshot.empty) {
                                alert("Este e-mail já possui uma conta cadastrada. Faça login!");
                                setIsRegister(false);
                                setLoading(false);
                                return;
                            }
                            await window.addDoc(window.collection(window.db, "usuarios"), { ...formData, dataCadastro: new Date().toISOString() });
                        }
                        const userObj = { nome: formData.nome, email: formData.email, cpf: formData.cpf, telefone: formData.telefone, role: 'cliente' };
                        localStorage.setItem('elora_user', JSON.stringify(userObj));
                        onSuccess(userObj);
                    } else {
                        if (window.db && window.collection && window.query) {
                            const q = window.query(window.collection(window.db, "usuarios"), window.where("email", "==", formData.email));
                            const snapshot = await window.getDocs(q);
                            if (snapshot.empty) {
                                alert("E-mail não encontrado. Crie uma conta primeiro!");
                                setIsRegister(true);
                                setLoading(false);
                                return;
                            }
                            let userData = null;
                            snapshot.forEach(doc => { userData = doc.data(); });

                            if (userData.senha && userData.senha !== formData.senha) {
                                alert("Senha incorreta!");
                                setLoading(false);
                                return;
                            }
                            const userObj = { nome: userData.nome, email: userData.email, cpf: userData.cpf, telefone: userData.telefone, role: 'cliente' };
                            localStorage.setItem('elora_user', JSON.stringify(userObj));
                            onSuccess(userObj);
                        }
                    }
                } catch (err) {
                    console.error(err);
                    alert("Erro ao conectar com o servidor.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-3 sm:p-4 backdrop-blur-md">
                    <div className={`${darkMode ? 'bg-slate-900 text-slate-100 border-slate-800' : 'bg-white text-slate-900 border-slate-200'} border p-6 sm:p-8 max-w-md w-full relative animate-fade-in shadow-2xl rounded-2xl`}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-elora-gold transition-colors"><Icon name="x" className="w-6 h-6" /></button>
                        <div className="text-center mb-6">
                            <Icon name="user" className="w-10 h-10 text-elora-gold mx-auto mb-2" />
                            <h3 className="text-2xl font-serif">{isRegister ? 'Criar Sua Conta' : 'Acessar Sua Conta'}</h3>
                            {mensagemExtra && <p className="text-xs text-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 p-2.5 rounded-md mt-2 font-medium">{mensagemExtra}</p>}
                        </div>
                        <div className="flex border-b border-slate-200 dark:border-slate-800 mb-6">
                            <button onClick={() => setIsRegister(true)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${isRegister ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400'}`}>Criar Conta</button>
                            <button onClick={() => setIsRegister(false)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${!isRegister ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400'}`}>Já Sou Cliente</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {isRegister && <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Nome Completo *</label><input name="nome" value={formData.nome} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="Ex: Maria Silva" /></div>}
                            <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">{isRegister ? 'E-mail *' : 'E-mail ou Usuário *'}</label><input type="text" name="email" value={formData.email} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="seu@email.com" /></div>
                            {isRegister && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">CPF *</label><input name="cpf" value={formData.cpf} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="000.000.000-00" /></div>
                                    <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">WhatsApp *</label><input name="telefone" value={formData.telefone} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="(11) 99999-9999" /></div>
                                </div>
                            )}
                            <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Senha *</label><input type="password" name="senha" value={formData.senha} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="••••••••" /></div>
                            <button type="submit" disabled={loading} className="w-full bg-elora-gold text-white py-4 mt-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20 flex items-center justify-center gap-2">
                                {loading ? <Icon name="loader-2" className="w-5 h-5 animate-spin" /> : (isRegister ? 'Cadastrar e Continuar' : 'Entrar na Conta')}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: MINHA CONTA (CLIENTE) ---
        function CustomerAccount({ user, logout, voltar, darkMode }) {
            const [pedidos, setPedidos] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const buscarPedidos = async () => {
                    if (window.db && window.collection && window.query) {
                        try {
                            const q = window.query(window.collection(window.db, "pedidos"), window.where("cliente.email", "==", user.email));
                            const querySnapshot = await window.getDocs(q);
                            const lista = [];
                            querySnapshot.forEach((doc) => { lista.push({ id: doc.id, ...doc.data() }); });
                            lista.sort((a,b) => new Date(b.dataCriacao) - new Date(a.dataCriacao));
                            setPedidos(lista);
                        } catch (e) { console.error(e); }
                    }
                    setLoading(false);
                };
                buscarPedidos();
            }, [user.email]);

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 md:py-12 animate-fade-in">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 md:mb-12 border-b border-slate-200 dark:border-slate-800 pb-6">
                        <div>
                            <h2 className="text-3xl md:text-4xl font-serif">Minha Conta</h2>
                            <p className="text-slate-400 mt-1 text-sm">Bem-vindo(a), {user.nome.split(' ')[0]}</p>
                        </div>
                        <button onClick={logout} className="flex items-center gap-2 text-red-500 hover:text-red-700 text-xs font-semibold uppercase tracking-widest transition-colors"><Icon name="log-out" className="w-4 h-4" /> Sair</button>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 space-y-6">
                            <h3 className="text-xl font-serif flex items-center gap-3 mb-6"><Icon name="package" className="w-5 h-5 text-elora-gold" /> Meus Pedidos</h3>
                            {loading ? (
                                <div className="text-center py-12 text-slate-400"><Icon name="loader-2" className="w-8 h-8 animate-spin mx-auto" /></div>
                            ) : pedidos.length === 0 ? (
                                <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-8 rounded-xl text-center shadow-sm`}>
                                    <p className="text-slate-400 mb-4 text-sm">Nenhum pedido encontrado na sua conta.</p>
                                    <button onClick={voltar} className="text-elora-gold font-bold uppercase text-xs tracking-widest hover:underline">Ir para a Loja</button>
                                </div>
                            ) : (
                                pedidos.map(pedido => {
                                    const dataPedido = new Date(pedido.dataCriacao);
                                    const dataEntrega = new Date(dataPedido);
                                    dataEntrega.setDate(dataEntrega.getDate() + 7);
                                    
                                    let totalDisplay = '0.00';
                                    if (pedido.valorTotal) {
                                        totalDisplay = pedido.valorTotal.toFixed(2);
                                    } else if (pedido.produto && pedido.produto.preco) {
                                        totalDisplay = pedido.produto.preco.toFixed(2);
                                    }

                                    return (
                                        <div key={pedido.id} className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border shadow-lg rounded-xl overflow-hidden`}>
                                            <div className={`${darkMode ? 'bg-slate-800/50 border-slate-800' : 'bg-slate-50 border-slate-100'} border-b p-4 sm:p-5 flex justify-between items-center text-xs`}>
                                                <div><span className="text-slate-400 uppercase tracking-widest font-semibold block text-[10px]">Pedido {pedido.order_nsu}</span><span className="font-medium">{dataPedido.toLocaleDateString('pt-BR')}</span></div>
                                                <div className="text-right"><span className="text-slate-400 uppercase tracking-widest font-semibold block text-[10px]">Status</span><span className="font-bold text-elora-gold bg-elora-gold/10 px-2.5 py-1 rounded-full text-[11px]">{pedido.status || 'Aguardando Pagamento'}</span></div>
                                            </div>
                                            <div className="p-4 sm:p-6 flex flex-col sm:flex-row gap-4 sm:gap-6 items-center">
                                                <div className="bg-slate-100 dark:bg-slate-800 w-20 h-20 sm:w-24 sm:h-24 rounded-md flex items-center justify-center flex-shrink-0"><Icon name="shopping-bag" className="w-8 h-8 sm:w-10 sm:h-10 text-slate-400" /></div>
                                                <div className="flex-grow text-center sm:text-left">
                                                    <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-1">Total da Compra</span>
                                                    <h4 className="text-base sm:text-lg font-serif">R$ {totalDisplay}</h4>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                        <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 h-fit shadow-xl rounded-xl`}>
                            <h3 className="text-xl font-serif flex items-center gap-3 mb-6"><Icon name="user" className="w-5 h-5 text-elora-gold" /> Dados Cadastrais</h3>
                            <div className="space-y-4 text-xs sm:text-sm text-slate-400">
                                <div><span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">Nome</span><p className="font-medium text-slate-200 dark:text-slate-100">{user.nome}</p></div>
                                <div><span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">E-mail</span><p className="font-medium text-slate-200 dark:text-slate-100">{user.email}</p></div>
                                <div><span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">CPF</span><p className="font-medium text-slate-200 dark:text-slate-100">{user.cpf || 'Não informado'}</p></div>
                                <div><span className="block text-[10px] uppercase tracking-widest font-semibold mb-1">WhatsApp</span><p className="font-medium text-slate-200 dark:text-slate-100">{user.telefone || 'Não informado'}</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: PAINEL ADMIN (GESTÃO COMPLETA + UPLOAD DE FOTOS) ---
        function AdminDashboard({ produtos, setProdutos, darkMode, logout }) {
            const [aba, setAba] = useState('produtos');
            const [pedidosAll, setPedidosAll] = useState([]);
            
            // Formulário de Produtos
            const [produtoEditando, setProdutoEditando] = useState(null);
            const [novoProduto, setNovoProduto] = useState({ nome: '', marca: '', preco: '', estoque: '', imagem: '' });
            const [imagemArquivo, setImagemArquivo] = useState(null); // Estado para guardar o ficheiro da imagem
            const [previewImg, setPreviewImg] = useState(null); // Estado para mostrar o preview
            const [carregando, setCarregando] = useState(false);
            const [carregandoText, setCarregandoText] = useState('');

            const carregarPedidos = async () => {
                if (window.db && window.collection && window.getDocs) {
                    try {
                        const qs = await window.getDocs(window.collection(window.db, "pedidos"));
                        const lista = [];
                        qs.forEach(doc => lista.push({ id: doc.id, ...doc.data() }));
                        lista.sort((a,b) => new Date(b.dataCriacao) - new Date(a.dataCriacao));
                        setPedidosAll(lista);
                    } catch (e) { console.error(e); }
                }
            };

            useEffect(() => { if (aba === 'pedidos') carregarPedidos(); }, [aba]);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setImagemArquivo(file);
                    setPreviewImg(URL.createObjectURL(file));
                }
            };

            const handleSubmitProduto = async (e) => {
                e.preventDefault();
                setCarregando(true);
                setCarregandoText("A preparar...");
                
                let urlImagemFinal = novoProduto.imagem || './royal-amber.jpeg';

                try {
                    // SE o usuário selecionou uma nova foto, fazemos o UPLOAD pro Firebase Storage
                    if (imagemArquivo) {
                        setCarregandoText("Enviando foto para a nuvem...");
                        if (window.storage && window.storageRef && window.uploadBytes && window.getDownloadURL) {
                            const imgRef = window.storageRef(window.storage, `perfumes/${Date.now()}_${imagemArquivo.name}`);
                            await window.uploadBytes(imgRef, imagemArquivo);
                            urlImagemFinal = await window.getDownloadURL(imgRef);
                        } else {
                            alert("Erro: Firebase Storage não inicializado.");
                            setCarregando(false);
                            return;
                        }
                    }

                    setCarregandoText("A guardar dados...");
                    const obj = {
                        nome: novoProduto.nome, 
                        marca: novoProduto.marca,
                        preco: parseFloat(novoProduto.preco), 
                        estoque: parseInt(novoProduto.estoque),
                        imagem: urlImagemFinal, 
                        tag: 'Oficial'
                    };

                    if (window.db && window.collection && window.addDoc && window.updateDoc && window.doc) {
                        if (produtoEditando) {
                            await window.updateDoc(window.doc(window.db, "perfumes", produtoEditando), obj);
                            setProdutos(produtos.map(p => p.id === produtoEditando ? { ...obj, id: produtoEditando } : p));
                            alert("Produto atualizado com sucesso!");
                        } else {
                            const docRef = await window.addDoc(window.collection(window.db, "perfumes"), obj);
                            setProdutos([...produtos, { ...obj, id: docRef.id }]);
                            alert("Produto cadastrado com foto!");
                        }
                    }
                } catch (error) { 
                    console.error(error); 
                    alert("Erro ao salvar produto."); 
                }
                
                cancelarEdicao();
                setCarregando(false);
                setCarregandoText('');
            };

            const editarProduto = (p) => {
                setProdutoEditando(p.id);
                setNovoProduto({ nome: p.nome, marca: p.marca, preco: p.preco, estoque: p.estoque, imagem: p.imagem });
                setPreviewImg(p.imagem);
                setImagemArquivo(null); // Reseta o file picker
            };

            const cancelarEdicao = () => {
                setProdutoEditando(null);
                setNovoProduto({ nome: '', marca: '', preco: '', estoque: '', imagem: '' });
                setPreviewImg(null);
                setImagemArquivo(null);
            };

            const apagarProduto = async (id) => {
                if(!confirm("Tem a certeza que deseja excluir este produto?")) return;
                try {
                    await window.deleteDoc(window.doc(window.db, "perfumes", id));
                    setProdutos(produtos.filter(p => p.id !== id));
                } catch (e) { alert("Erro ao excluir."); }
            };

            const atualizarStatusPedido = async (id, novoStatus) => {
                try {
                    await window.updateDoc(window.doc(window.db, "pedidos", id), { status: novoStatus });
                    setPedidosAll(pedidosAll.map(p => p.id === id ? { ...p, status: novoStatus } : p));
                } catch (e) { alert("Erro ao atualizar status."); }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 md:py-12 animate-fade-in">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
                        <div className="flex items-center gap-3">
                            <Icon name="layout-dashboard" className="text-elora-gold w-8 h-8" />
                            <div><h2 className="text-2xl sm:text-3xl font-serif">Painel de Gestão ERP</h2><p className="text-xs text-slate-400 mt-1">Acesso Exclusivo Administrador</p></div>
                        </div>
                        <button onClick={logout} className="flex items-center gap-2 text-red-500 hover:text-red-700 text-xs font-semibold uppercase tracking-widest transition-colors"><Icon name="log-out" className="w-4 h-4" /> Sair do Painel</button>
                    </div>
                    <div className="flex border-b border-slate-200 dark:border-slate-800 mb-8">
                        <button onClick={() => setAba('produtos')} className={`px-6 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${aba === 'produtos' ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'}`}>Catálogo de Produtos</button>
                        <button onClick={() => setAba('pedidos')} className={`px-6 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${aba === 'pedidos' ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'}`}>Gestão de Pedidos</button>
                    </div>

                    {aba === 'produtos' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-fade-in">
                            <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 h-fit rounded-xl shadow-xl`}>
                                <h3 className="text-lg font-serif mb-6 flex items-center gap-2"><Icon name={produtoEditando ? "edit-3" : "plus-circle"} className="w-5 h-5 text-elora-gold" />{produtoEditando ? "Editar Fragrância" : "Nova Fragrância"}</h3>
                                <form onSubmit={handleSubmitProduto} className="space-y-4">
                                    <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Nome</label><input value={novoProduto.nome} onChange={(e) => setNovoProduto({...novoProduto, nome: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required /></div>
                                    <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Marca</label><input value={novoProduto.marca} onChange={(e) => setNovoProduto({...novoProduto, marca: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Preço (R$)</label><input type="number" step="0.01" value={novoProduto.preco} onChange={(e) => setNovoProduto({...novoProduto, preco: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required /></div>
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Estoque</label><input type="number" value={novoProduto.estoque} onChange={(e) => setNovoProduto({...novoProduto, estoque: e.target.value})} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-xs outline-none focus:border-elora-gold rounded-md`} required /></div>
                                    </div>
                                    
                                    {/* UPLOAD DE IMAGEM */}
                                    <div className="border border-dashed border-slate-300 dark:border-slate-700 p-4 rounded-md text-center">
                                        <label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-2 font-semibold cursor-pointer">
                                            <Icon name="upload-cloud" className="w-6 h-6 mx-auto mb-2 text-elora-gold" />
                                            {produtoEditando && !imagemArquivo ? 'Mudar Foto do Produto' : 'Escolher Foto do Produto'}
                                            <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                                        </label>
                                        {previewImg && (
                                            <div className="mt-3 flex justify-center">
                                                <img src={previewImg} alt="Preview" className="h-20 object-contain rounded border border-slate-200 dark:border-slate-600" />
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex gap-2 mt-4">
                                        <button type="submit" disabled={carregando} className="flex-1 bg-elora-gold text-white py-3.5 text-[11px] font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-md">
                                            {carregando ? carregandoText : (produtoEditando ? 'Guardar' : 'Cadastrar')}
                                        </button>
                                        {produtoEditando && <button type="button" onClick={cancelarEdicao} className="bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-4 py-3.5 rounded-md text-[11px] font-bold uppercase tracking-widest hover:bg-slate-300 transition-colors">Cancelar</button>}
                                    </div>
                                </form>
                            </div>
                            <div className={`lg:col-span-2 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 rounded-xl shadow-xl`}>
                                <h3 className="text-lg font-serif mb-6 flex items-center gap-2"><Icon name="package" className="w-5 h-5 text-elora-gold" /> Catálogo Ativo</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs sm:text-sm text-slate-400">
                                        <thead><tr className="border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-widest"><th className="pb-3 font-semibold">Produto</th><th className="pb-3 font-semibold">Preço / Estoque</th><th className="pb-3 font-semibold text-right">Ações</th></tr></thead>
                                        <tbody>
                                            {produtos.length === 0 ? <tr><td colSpan="3" className="py-8 text-center text-slate-500 text-xs">Catálogo vazio.</td></tr> : (
                                                produtos.map(p => (
                                                    <tr key={p.id} className="border-b border-slate-100 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                                        <td className="py-3 flex items-center gap-3"><img src={p.imagem} className="w-10 h-10 object-cover rounded" /><div><span className="text-elora-gold text-[9px] uppercase font-bold block tracking-widest">{p.marca}</span><span className="font-medium text-slate-700 dark:text-slate-200">{p.nome}</span></div></td>
                                                        <td className="py-3"><div className="font-medium">R$ {Number(p.preco).toFixed(2)}</div><div className="text-[10px] mt-0.5">{p.estoque} un. disponíveis</div></td>
                                                        <td className="py-3 text-right space-x-2">
                                                            <button onClick={() => editarProduto(p)} className="p-1.5 text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded transition-colors" title="Editar"><Icon name="pencil" className="w-4 h-4" /></button>
                                                            <button onClick={() => apagarProduto(p.id)} className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition-colors" title="Apagar"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                    {aba === 'pedidos' && (
                        <div className={`animate-fade-in ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 rounded-xl shadow-xl`}>
                            <h3 className="text-lg font-serif mb-6 flex items-center gap-2"><Icon name="shopping-bag" className="w-5 h-5 text-elora-gold" /> Controle de Vendas</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs text-slate-400">
                                    <thead><tr className="border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-widest"><th className="pb-3 font-semibold">Data / NSU</th><th className="pb-3 font-semibold">Cliente</th><th className="pb-3 font-semibold">Total (R$)</th><th className="pb-3 font-semibold">Status</th></tr></thead>
                                    <tbody>
                                        {pedidosAll.length === 0 ? <tr><td colSpan="4" className="py-8 text-center text-slate-500">Nenhum pedido recebido.</td></tr> : (
                                            pedidosAll.map(p => {
                                                let totalDisplayAdmin = '0.00';
                                                if (p.valorTotal) {
                                                    totalDisplayAdmin = p.valorTotal.toFixed(2);
                                                } else if (p.produto && p.produto.preco) {
                                                    totalDisplayAdmin = p.produto.preco.toFixed(2);
                                                }

                                                return (
                                                    <tr key={p.id} className="border-b border-slate-100 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/30">
                                                        <td className="py-4"><div className="font-medium text-slate-700 dark:text-slate-200">{new Date(p.dataCriacao).toLocaleDateString('pt-BR')}</div><div className="text-[9px] tracking-wider mt-0.5">{p.order_nsu}</div></td>
                                                        <td className="py-4"><div className="font-medium text-slate-700 dark:text-slate-200">{p.cliente.nome}</div><div className="text-[10px]">{p.cliente.telefone}</div></td>
                                                        <td className="py-4"><div className="font-medium text-elora-gold">R$ {totalDisplayAdmin}</div></td>
                                                        <td className="py-4">
                                                            <select value={p.status || 'Aguardando Pagamento'} onChange={(e) => atualizarStatusPedido(p.id, e.target.value)} className={`text-[10px] font-bold uppercase tracking-wider p-1.5 rounded outline-none cursor-pointer border ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                                                                <option value="Aguardando Pagamento">Aguardando Pagamento</option><option value="Pagamento Aprovado">Pagamento Aprovado</option><option value="Em Rota de Entrega">Em Rota de Entrega</option><option value="Entregue">Entregue</option><option value="Cancelado">Cancelado</option>
                                                            </select>
                                                        </td>
                                                    </tr>
                                                )
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- COMPONENTE: CHECKOUT (FINALIZAÇÃO COM O CARRINHO) ---
        function Checkout({ cart, user, voltarParaLoja, darkMode }) {
            const [loading, setLoading] = useState(false);
            const [endereco, setEndereco] = useState({ cep: '', rua: '', numero: '', complemento: '', bairro: '', cidade: '', uf: 'SP' });
            
            const total = cart.reduce((sum, item) => sum + item.preco, 0);
            const handleChange = (e) => setEndereco({ ...endereco, [e.target.name]: e.target.value });

            const processarPedido = async (e) => {
                e.preventDefault();
                setLoading(true);
                const orderNsu = "ELORA-" + Date.now();
                const clienteCompleto = { nome: user.nome, email: user.email, cpf: user.cpf, telefone: user.telefone, ...endereco };

                const itemsForAPI = cart.map(item => ({
                    quantity: 1, price: Math.round(item.preco * 100), description: `Elora: ${item.marca} - ${item.nome}`
                }));

                try {
                    if (window.db && window.collection && window.addDoc) {
                        await window.addDoc(window.collection(window.db, "pedidos"), {
                            order_nsu: orderNsu, cliente: clienteCompleto, 
                            itens: cart, valorTotal: total,
                            dataCriacao: new Date().toISOString(), status: "Aguardando Pagamento"
                        });
                    }
                } catch (err) { console.error(err); }

                const pedido = { order_nsu: orderNsu, customer: clienteCompleto, items: itemsForAPI };
                try {
                    const resposta = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pedido) });
                    const dados = await resposta.json();
                    if (dados.url || dados.checkout_url) window.location.href = dados.url || dados.checkout_url;
                    else setLoading(false);
                } catch (erro) { alert("Erro ao conectar."); setLoading(false); }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 lg:py-16 grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 animate-fade-in">
                    <div>
                        <button onClick={voltarParaLoja} className="flex items-center gap-2 text-slate-400 hover:text-elora-gold mb-6 text-xs uppercase tracking-widest font-semibold transition-colors"><Icon name="arrow-left" className="w-4 h-4" /> Voltar ao Carrinho</button>
                        <form onSubmit={processarPedido} className="space-y-6">
                            <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-8 shadow-xl rounded-xl`}>
                                <h3 className="text-xl font-serif mb-6 flex items-center gap-3"><Icon name="map-pin" className="text-elora-gold w-5 h-5" /> Endereço de Entrega</h3>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">CEP *</label><input name="cep" value={endereco.cep} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="00000-000" /></div>
                                        <div className="sm:col-span-2"><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Rua / Avenida *</label><input name="rua" value={endereco.rua} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="Nome da rua" /></div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Número *</label><input name="numero" value={endereco.numero} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="123" /></div>
                                        <div className="sm:col-span-2"><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Complemento</label><input name="complemento" value={endereco.complemento} onChange={handleChange} className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} placeholder="Apto, Bloco, etc." /></div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Bairro *</label><input name="bairro" value={endereco.bairro} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} /></div>
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Cidade *</label><input name="cidade" value={endereco.cidade} onChange={handleChange} required className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md`} /></div>
                                        <div><label className="block text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Estado *</label><input name="uf" value={endereco.uf} onChange={handleChange} required maxLength="2" className={`w-full ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'} border p-3 text-sm outline-none focus:border-elora-gold rounded-md uppercase`} placeholder="SP" /></div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-elora-gold text-white py-4 text-xs sm:text-sm font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-xl shadow-elora-gold/20 flex items-center justify-center gap-3">
                                {loading ? <Icon name="loader-2" className="w-5 h-5 animate-spin" /> : 'Confirmar Endereço e Pagar'}
                            </button>
                        </form>
                    </div>
                    
                    <div className={`${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border p-6 sm:p-10 h-fit shadow-2xl rounded-xl relative overflow-hidden lg:sticky lg:top-28`}>
                        <h3 className="text-xl sm:text-2xl font-serif mb-6">Resumo do Pedido ({cart.length} itens)</h3>
                        <div className="bg-emerald-500/10 border border-emerald-500/20 p-3.5 rounded-lg flex items-center gap-3 mb-6">
                            <Icon name="sparkles" className="w-5 h-5 text-emerald-500 flex-shrink-0" />
                            <p className="text-xs text-emerald-600 dark:text-emerald-400 font-medium"><strong>Ganhe 5% OFF no PIX!</strong> Aplicado no pagamento.</p>
                        </div>

                        <div className="max-h-60 overflow-y-auto pr-2 space-y-4 mb-6 pb-6 border-b border-slate-200 dark:border-slate-800">
                            {cart.map((item, index) => (
                                <div key={index} className="flex items-center gap-4">
                                    <img src={item.imagem} className="w-16 h-16 object-cover rounded-md shadow-sm" alt={item.nome} />
                                    <div>
                                        <p className="font-serif text-sm">{item.nome}</p>
                                        <p className="text-slate-400 font-medium text-xs mt-1">R$ {item.preco.toFixed(2)}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between font-serif text-2xl sm:text-3xl mt-6">
                            <span>Total</span><span className="text-elora-gold">R$ {total.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE PRINCIPAL APP ---
        function App() {
            const [view, setView] = useState('store'); 
            const [quizOpen, setQuizOpen] = useState(false);
            const [authModalOpen, setAuthModalOpen] = useState(false);
            const [authNotice, setAuthNotice] = useState('');
            const [produtos, setProdutos] = useState([]); 
            
            const [cart, setCart] = useState([]);
            const [cartOpen, setCartOpen] = useState(false);
            const [produtoSelecionado, setProdutoSelecionado] = useState(null);

            const [darkMode, setDarkMode] = useState(false);
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('elora_user');
                return saved ? JSON.parse(saved) : null;
            });

            useEffect(() => {
                const carregarPerfumes = async () => {
                    setTimeout(async () => {
                        if (window.db && window.collection && window.getDocs) {
                            try {
                                const qs = await window.getDocs(window.collection(window.db, "perfumes"));
                                const lista = [];
                                qs.forEach(doc => lista.push({ id: doc.id, ...doc.data() }));
                                setProdutos(lista);
                            } catch (e) { setProdutos([]); }
                        } else setProdutos([]);
                    }, 800);
                };
                carregarPerfumes();
            }, [view]);

            const addToCart = (produto) => {
                setCart([...cart, produto]);
                setCartOpen(true);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                if (newCart.length === 0) setCartOpen(false);
            };

            const iniciarCheckout = () => {
                setCartOpen(false);
                if (!user) {
                    setAuthNotice('Crie sua conta para prosseguir com a compra.');
                    setAuthModalOpen(true);
                } else {
                    setView('checkout');
                    window.scrollTo(0,0);
                }
            };

            const logout = () => {
                localStorage.removeItem('elora_user');
                setUser(null);
                setView('store');
            };

            const handleAuthSuccess = (loggedUser) => {
                setUser(loggedUser);
                setAuthModalOpen(false);
                setAuthNotice('');

                if (loggedUser.role === 'admin') setView('admin');
                else if (cart.length > 0) { setView('checkout'); window.scrollTo(0,0); }
                else setView('account');
            };

            return (
                <div className={`min-h-screen font-sans flex flex-col transition-colors duration-300 ${darkMode ? 'bg-slate-950 text-slate-100 dark' : 'bg-[#FDFBF7] text-slate-900'}`}>
                    
                    <WhatsAppButton />

                    <header className={`${darkMode ? 'bg-elora-darkbg border-slate-800' : 'bg-white/95 border-slate-200'} backdrop-blur-md border-b py-4 md:py-6 sticky top-0 z-50 shadow-sm transition-colors`}>
                        <div className="max-w-7xl w-full mx-auto px-4 flex justify-between items-center relative">
                            <div className="w-1/3 flex items-center gap-3">
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-elora-gold transition-colors flex items-center gap-2 text-xs">
                                    <Icon name={darkMode ? "sun" : "moon"} className={`w-4 h-4 ${darkMode ? 'text-amber-400' : ''}`} />
                                    <span className="hidden md:inline font-semibold uppercase tracking-wider text-[10px]">{darkMode ? 'Claro' : 'Escuro'}</span>
                                </button>
                                {user && user.role === 'admin' && view !== 'admin' && (
                                    <button onClick={() => setView('admin')} className="text-[10px] font-bold uppercase tracking-widest text-elora-gold hover:text-amber-600 hidden lg:block border border-elora-gold px-3 py-1.5 rounded">Painel</button>
                                )}
                            </div>

                            <div className="absolute left-1/2 -translate-x-1/2">
                                <LogoPremium onClick={() => setView('store')} />
                            </div>

                            <div className="flex items-center justify-end space-x-4 w-1/3">
                                <button onClick={() => {
                                    if (user && user.role === 'admin') setView('admin');
                                    else if (user) setView('account');
                                    else { setAuthNotice(''); setAuthModalOpen(true); }
                                }} className="flex items-center gap-2 text-[10px] sm:text-[11px] font-bold uppercase tracking-[0.15em] text-slate-500 dark:text-slate-300 hover:text-elora-gold transition-colors py-1">
                                    <Icon name={user && user.role === 'admin' ? "layout-dashboard" : "user"} className="w-4 h-4 sm:w-5 sm:h-5" />
                                    <span className="hidden sm:inline">{user && user.role === 'admin' ? 'Gestão ERP' : (user ? 'Minha Conta' : 'Entrar')}</span>
                                </button>
                                
                                {user && user.role !== 'admin' && (
                                    <button onClick={() => setCartOpen(true)} className="relative text-slate-500 dark:text-slate-300 hover:text-elora-gold transition-colors p-1">
                                        <Icon name="shopping-bag" className="w-5 h-5" />
                                        {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full">{cart.length}</span>}
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'admin' && user && user.role === 'admin' && <AdminDashboard produtos={produtos} setProdutos={setProdutos} darkMode={darkMode} logout={logout} />}
                        {view === 'account' && user && user.role !== 'admin' && <CustomerAccount user={user} logout={logout} voltar={() => setView('store')} darkMode={darkMode} />}
                        {view === 'checkout' && cart.length > 0 && user && <Checkout cart={cart} user={user} voltarParaLoja={() => {setView('store'); setCartOpen(true);}} darkMode={darkMode} />}
                        
                        {view === 'store' && (
                            <div className="animate-fade-in">
                                <section className="relative h-[65vh] sm:h-[80vh] w-full flex items-center justify-center overflow-hidden bg-slate-900">
                                    <img src="./banner-promo.jpeg" className="absolute inset-0 w-full h-full object-cover z-0 opacity-80" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent z-10"></div>
                                    <div className="relative z-20 text-center px-4 mt-8 max-w-4xl">
                                        <h1 className="text-4xl sm:text-6xl md:text-8xl font-serif mb-4 sm:mb-6 text-white tracking-tight drop-shadow-2xl">A Essência do <span className="text-elora-gold">Oriente</span>.</h1>
                                        <p className="text-sm sm:text-lg text-slate-200 mb-8 max-w-2xl mx-auto font-medium drop-shadow">Fragrâncias árabes exclusivas e refinadas.</p>
                                        <button onClick={() => setQuizOpen(true)} className="bg-elora-gold text-white px-6 sm:px-10 py-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-all shadow-2xl flex items-center mx-auto gap-2.5 rounded-md hover:scale-105">
                                            <Icon name="flask-conical" className="w-4 h-4" /> Encontrar Minha Fragrância
                                        </button>
                                    </div>
                                </section>

                                <section className="max-w-7xl mx-auto px-4 py-16 sm:py-24">
                                    <h2 className="text-3xl sm:text-5xl font-serif mb-12 sm:mb-16 text-center">Catálogo Exclusivo</h2>
                                    {produtos.length === 0 ? (
                                        <div className="text-center py-16 border border-dashed border-slate-300 dark:border-slate-800 rounded-2xl p-8">
                                            <Icon name="sparkles" className="w-12 h-12 text-elora-gold mx-auto mb-4 opacity-80" />
                                            <h3 className="text-2xl font-serif mb-2">Catálogo Oficial em Preparação</h3>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 sm:gap-8">
                                            {produtos.map((produto) => (
                                                <div key={produto.id} className={`group flex flex-col ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100'} border shadow-lg hover:shadow-2xl hover:border-elora-gold/30 transition-all duration-500 p-4 sm:p-5 rounded-xl`}>
                                                    <div className="relative aspect-[4/5] bg-slate-50 dark:bg-slate-800 overflow-hidden flex items-center justify-center p-4 mb-5 rounded-md cursor-pointer" onClick={() => setProdutoSelecionado(produto)}>
                                                        {produto.tag && <div className="absolute top-3 left-3 bg-elora-gold text-white text-[9px] font-bold uppercase tracking-widest px-2.5 py-1 z-10 rounded-sm shadow-sm">{produto.tag}</div>}
                                                        <img src={produto.imagem} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 rounded-md shadow-sm" alt={produto.nome} />
                                                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-300">
                                                            <span className="text-white text-xs font-bold uppercase tracking-widest border border-white px-4 py-2 rounded">Ver Detalhes</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-center mt-auto flex flex-col items-center">
                                                        <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest mb-1.5 block">{produto.marca}</span>
                                                        <h3 className="text-lg font-serif mb-2 group-hover:text-elora-gold transition-colors">{produto.nome}</h3>
                                                        <p className="text-slate-400 mb-5 font-medium text-base">R$ {Number(produto.preco).toFixed(2)}</p>
                                                        <button onClick={() => addToCart(produto)} className="w-full border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 py-3.5 text-xs font-bold uppercase tracking-widest hover:bg-elora-gold hover:border-elora-gold hover:text-white transition-all rounded-md flex justify-center items-center gap-2">
                                                            <Icon name="shopping-cart" className="w-4 h-4" /> Adicionar
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>
                            </div>
                        )}
                    </main>

                    <footer className={`${darkMode ? 'bg-elora-darkbg border-slate-800' : 'bg-white border-slate-200'} border-t py-12 mt-auto text-center transition-colors`}>
                        <LogoPremium isSmall={true} />
                        <p className="text-slate-400 text-[10px] tracking-widest mt-6 uppercase">Todos os direitos reservados &copy; 2026.</p>
                    </footer>

                    <CartSidebar isOpen={cartOpen} onClose={() => setCartOpen(false)} cart={cart} removeFromCart={removeFromCart} onCheckout={iniciarCheckout} darkMode={darkMode} />
                    {produtoSelecionado && <ProductModal produto={produtoSelecionado} onClose={() => setProdutoSelecionado(null)} onAddToCart={addToCart} darkMode={darkMode} />}
                    {quizOpen && <QuizModal onClose={() => setQuizOpen(false)} produtos={produtos} irParaCheckout={(p) => { addToCart(p); setQuizOpen(false); }} darkMode={darkMode} />}
                    {authModalOpen && <AuthModal onClose={() => setAuthModalOpen(false)} onSuccess={handleAuthSuccess} mensagemExtra={authNotice} darkMode={darkMode} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
