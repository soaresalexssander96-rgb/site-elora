<html lang="pt-BR">
<head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPImRf4Mp7-AAsTzOXZNgS4NGvENeZsM4",
    authDomain: "elora-parfums.firebaseapp.com",
    projectId: "elora-parfums",
    storageBucket: "elora-parfums.firebasestorage.app",
    messagingSenderId: "953833053006",
    appId: "1:953833053006:web:141e5f4fb22e3a017fdc1f",
    measurementId: "G-YN6WE6QZP7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  window.db = db;
  window.collection = collection;
  window.getDocs = getDocs;
  window.addDoc = addDoc;
  window.query = query;
  window.where = where;
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elora Parfums | A Essência do Oriente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        elora: { deepblue: '#050B14', gold: '#D4AF37', light: '#FDFBF7' }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; color: #0f172a; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body class="antialiased selection:bg-elora-gold selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            ShoppingBag, Search, Sparkles, FlaskConical, X, 
            LayoutDashboard, PlusCircle, Package, CreditCard, 
            QrCode, CheckCircle, ArrowLeft, Star, Loader2, ShieldCheck, MapPin, User, LogOut, Clock, Truck, Lock
        } = lucide;

        const produtosIniciais = [
            { id: 1, marca: 'Orientica', nome: 'Royal Amber', categoria: 'Lançamentos', genero: 'Unissex', preco: 899.90, estoque: 5, tag: 'Joia da Coroa', imagem: './royal-amber.jpeg' },
            { id: 2, marca: 'Lattafa', nome: 'Coleção Asad', categoria: 'Masculino', genero: 'Masculino', preco: 289.90, estoque: 12, tag: 'Bestseller', imagem: './asad.jpeg' },
            { id: 3, marca: 'Lattafa', nome: 'Yara Rose', categoria: 'Feminino', genero: 'Feminino', preco: 259.90, estoque: 15, tag: 'Viral', imagem: './yara-rose.jpeg' },
            { id: 4, marca: 'Lattafa', nome: 'Fakar Rose', categoria: 'Feminino', genero: 'Feminino', preco: 319.90, estoque: 8, tag: 'Elegância', imagem: './fakar-rose.jpeg' }
        ];

        // --- MODAL DE AUTENTICAÇÃO (CRIAR CONTA OU ENTRAR) ---
        function AuthModal({ onClose, onSuccess, mensagemExtra }) {
            const [isRegister, setIsRegister] = useState(true); // Padrão: Criar Conta primeiro
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({
                nome: '', email: '', telefone: '', cpf: '', senha: ''
            });

            useEffect(() => { setTimeout(() => lucide.createIcons(), 50); }, [isRegister]);

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    if (isRegister) {
                        // 1. Verificar se usuário já existe no Firebase
                        if (window.db && window.collection && window.query) {
                            const q = window.query(window.collection(window.db, "usuarios"), window.where("email", "==", formData.email));
                            const snapshot = await window.getDocs(q);
                            
                            if (!snapshot.empty) {
                                alert("Este e-mail já possui uma conta cadastrada. Faça login!");
                                setIsRegister(false);
                                setLoading(false);
                                return;
                            }

                            // Salva novo usuário no Firebase Firestore
                            await window.addDoc(window.collection(window.db, "usuarios"), {
                                ...formData,
                                dataCadastro: new Date().toISOString()
                            });
                        }

                        const userObj = { nome: formData.nome, email: formData.email, cpf: formData.cpf, telefone: formData.telefone };
                        localStorage.setItem('elora_user', JSON.stringify(userObj));
                        onSuccess(userObj);
                    } else {
                        // Login
                        if (window.db && window.collection && window.query) {
                            const q = window.query(window.collection(window.db, "usuarios"), window.where("email", "==", formData.email));
                            const snapshot = await window.getDocs(q);
                            
                            if (snapshot.empty) {
                                alert("E-mail não encontrado. Crie uma conta primeiro!");
                                setIsRegister(true);
                                setLoading(false);
                                return;
                            }

                            let userData = null;
                            snapshot.forEach(doc => { userData = doc.data(); });

                            if (userData.senha && userData.senha !== formData.senha) {
                                alert("Senha incorreta!");
                                setLoading(false);
                                return;
                            }

                            const userObj = { nome: userData.nome, email: userData.email, cpf: userData.cpf, telefone: userData.telefone };
                            localStorage.setItem('elora_user', JSON.stringify(userObj));
                            onSuccess(userObj);
                        } else {
                            // Fallback caso offline
                            const userObj = { nome: formData.email.split('@')[0], email: formData.email, cpf: '', telefone: '' };
                            localStorage.setItem('elora_user', JSON.stringify(userObj));
                            onSuccess(userObj);
                        }
                    }
                } catch (err) {
                    console.error("Erro na autenticação:", err);
                    alert("Erro ao conectar com o servidor. Tente novamente.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                    <div className="bg-white border border-slate-200 p-8 max-w-md w-full relative animate-fade-in shadow-2xl rounded-2xl">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-elora-gold transition-colors">
                            <i data-lucide="x" className="w-6 h-6"></i>
                        </button>

                        <div className="text-center mb-6">
                            <i data-lucide="user" className="w-10 h-10 text-elora-gold mx-auto mb-3"></i>
                            <h3 className="text-2xl font-serif text-slate-900">
                                {isRegister ? 'Criar Sua Conta' : 'Acessar Sua Conta'}
                            </h3>
                            {mensagemExtra ? (
                                <p className="text-xs text-emerald-600 bg-emerald-50 border border-emerald-100 p-2.5 rounded-md mt-2 font-medium">
                                    {mensagemExtra}
                                </p>
                            ) : (
                                <p className="text-xs text-slate-500 mt-1">
                                    {isRegister ? 'Cadastre-se para gerenciar seus pedidos e rastreio.' : 'Digite suas credenciais para acessar sua área.'}
                                </p>
                            )}
                        </div>

                        {/* Abas Alternadoras */}
                        <div className="flex border-b border-slate-200 mb-6">
                            <button onClick={() => setIsRegister(true)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${isRegister ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400 hover:text-slate-600'}`}>
                                Criar Conta
                            </button>
                            <button onClick={() => setIsRegister(false)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-colors ${!isRegister ? 'border-b-2 border-elora-gold text-elora-gold' : 'text-slate-400 hover:text-slate-600'}`}>
                                Já Sou Cliente
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {isRegister && (
                                <div>
                                    <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Nome Completo *</label>
                                    <input name="nome" value={formData.nome} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="Ex: Maria Silva" />
                                </div>
                            )}

                            <div>
                                <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">E-mail *</label>
                                <input type="email" name="email" value={formData.email} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="seu@email.com" />
                            </div>

                            {isRegister && (
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">CPF *</label>
                                        <input name="cpf" value={formData.cpf} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="000.000.000-00" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">WhatsApp *</label>
                                        <input name="telefone" value={formData.telefone} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="(11) 99999-9999" />
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Senha *</label>
                                <input type="password" name="senha" value={formData.senha} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="••••••••" />
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-elora-gold text-white py-4 mt-4 text-xs font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-lg shadow-elora-gold/20 flex items-center justify-center gap-2">
                                {loading ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> : (isRegister ? 'Cadastrar e Continuar' : 'Entrar na Conta')}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: MINHA CONTA ---
        function CustomerAccount({ user, logout, voltar }) {
            const [pedidos, setPedidos] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const buscarPedidos = async () => {
                    if (window.db && window.collection && window.query) {
                        try {
                            const q = window.query(window.collection(window.db, "pedidos"), window.where("cliente.email", "==", user.email));
                            const querySnapshot = await window.getDocs(q);
                            const lista = [];
                            querySnapshot.forEach((doc) => { lista.push({ id: doc.id, ...doc.data() }); });
                            lista.sort((a,b) => new Date(b.dataCriacao) - new Date(a.dataCriacao));
                            setPedidos(lista);
                        } catch (e) { console.error(e); }
                    }
                    setLoading(false);
                };
                buscarPedidos();
                setTimeout(() => lucide.createIcons(), 50);
            }, [user.email]);

            return (
                <div className="max-w-5xl mx-auto px-4 py-12 animate-fade-in">
                    <div className="flex items-center justify-between mb-12 border-b border-slate-200 pb-6">
                        <div>
                            <h2 className="text-4xl font-serif text-slate-900">Minha Conta</h2>
                            <p className="text-slate-500 mt-2">Bem-vindo(a), {user.nome.split(' ')[0]}</p>
                        </div>
                        <button onClick={logout} className="flex items-center gap-2 text-red-500 hover:text-red-700 text-sm font-semibold uppercase tracking-widest transition-colors">
                            <i data-lucide="log-out" className="w-4 h-4"></i> Sair
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                        <div className="lg:col-span-2 space-y-6">
                            <h3 className="text-xl font-serif text-slate-900 flex items-center gap-3 mb-6">
                                <i data-lucide="package" className="w-5 h-5 text-elora-gold"></i> Meus Pedidos
                            </h3>
                            
                            {loading ? (
                                <div className="text-center py-12 text-slate-400"><i data-lucide="loader-2" className="w-8 h-8 animate-spin mx-auto"></i></div>
                            ) : pedidos.length === 0 ? (
                                <div className="bg-white border border-slate-100 p-8 rounded-xl text-center shadow-sm">
                                    <p className="text-slate-500 mb-4">Você ainda não possui pedidos registrados.</p>
                                    <button onClick={voltar} className="text-elora-gold font-bold uppercase text-sm tracking-widest hover:underline">Explorar Fragrâncias</button>
                                </div>
                            ) : (
                                pedidos.map(pedido => {
                                    const dataPedido = new Date(pedido.dataCriacao);
                                    const dataEntrega = new Date(dataPedido);
                                    dataEntrega.setDate(dataEntrega.getDate() + 7);

                                    return (
                                        <div key={pedido.id} className="bg-white border border-slate-100 shadow-lg rounded-xl overflow-hidden">
                                            <div className="bg-slate-50 border-b border-slate-100 p-5 flex justify-between items-center">
                                                <div>
                                                    <span className="text-[10px] text-slate-500 uppercase tracking-widest font-semibold block">Pedido {pedido.order_nsu}</span>
                                                    <span className="text-sm font-medium text-slate-900">{dataPedido.toLocaleDateString('pt-BR')}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[10px] text-slate-500 uppercase tracking-widest font-semibold block">Status</span>
                                                    <span className="text-sm font-bold text-elora-gold bg-elora-gold/10 px-3 py-1 rounded-full">{pedido.status || 'Aguardando Pagamento'}</span>
                                                </div>
                                            </div>
                                            <div className="p-6 flex flex-col md:flex-row gap-6 items-center">
                                                <div className="bg-slate-100 w-24 h-24 rounded-md flex items-center justify-center flex-shrink-0">
                                                    <i data-lucide="flask-conical" className="w-10 h-10 text-slate-400"></i>
                                                </div>
                                                <div className="flex-grow text-center md:text-left">
                                                    <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-1">{pedido.produto.marca}</span>
                                                    <h4 className="text-lg font-serif text-slate-900">{pedido.produto.nome}</h4>
                                                    <p className="text-slate-600 font-medium mt-1">R$ {pedido.produto.preco.toFixed(2)}</p>
                                                </div>
                                                <div className="w-full md:w-auto border-t md:border-t-0 md:border-l border-slate-100 pt-4 md:pt-0 md:pl-6 text-center md:text-left">
                                                    <div className="flex items-center justify-center md:justify-start gap-2 text-emerald-600 mb-1">
                                                        <i data-lucide="truck" className="w-4 h-4"></i>
                                                        <span className="text-xs font-bold uppercase tracking-widest">Previsão de Entrega</span>
                                                    </div>
                                                    <p className="text-sm text-slate-700">{dataEntrega.toLocaleDateString('pt-BR')}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>

                        <div className="bg-white border border-slate-100 p-8 h-fit shadow-xl rounded-xl">
                            <h3 className="text-xl font-serif text-slate-900 flex items-center gap-3 mb-6">
                                <i data-lucide="user" className="w-5 h-5 text-elora-gold"></i> Dados Cadastrais
                            </h3>
                            <div className="space-y-4 text-sm text-slate-600">
                                <div>
                                    <span className="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">Nome</span>
                                    <p className="font-medium text-slate-900">{user.nome}</p>
                                </div>
                                <div>
                                    <span className="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">E-mail</span>
                                    <p className="font-medium text-slate-900">{user.email}</p>
                                </div>
                                <div>
                                    <span className="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">CPF</span>
                                    <p className="font-medium text-slate-900">{user.cpf || 'Não informado'}</p>
                                </div>
                                <div>
                                    <span className="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">WhatsApp</span>
                                    <p className="font-medium text-slate-900">{user.telefone || 'Não informado'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: CHECKOUT (ENDEREÇO DE ENTREGA) ---
        function Checkout({ produto, user, voltarParaLoja }) {
            const [loading, setLoading] = useState(false);
            const [endereco, setEndereco] = useState({
                cep: '', rua: '', numero: '', complemento: '', bairro: '', cidade: '', uf: 'SP'
            });

            useEffect(() => { setTimeout(() => lucide.createIcons(), 50); }, []);

            const handleChange = (e) => setEndereco({ ...endereco, [e.target.name]: e.target.value });

            const processarPedido = async (e) => {
                e.preventDefault();
                setLoading(true);

                const orderNsu = "ELORA-" + Date.now();
                const precoCentavos = Math.round(produto.preco * 100);

                const clienteCompleto = {
                    nome: user.nome,
                    email: user.email,
                    cpf: user.cpf,
                    telefone: user.telefone,
                    ...endereco
                };

                // 1. Salvar o pedido no Firebase Firestore
                try {
                    if (window.db && window.collection && window.addDoc) {
                        await window.addDoc(window.collection(window.db, "pedidos"), {
                            order_nsu: orderNsu, 
                            cliente: clienteCompleto, 
                            produto: { id: produto.id, nome: produto.nome, marca: produto.marca, preco: produto.preco },
                            dataCriacao: new Date().toISOString(), 
                            status: "Aguardando Pagamento"
                        });
                    }
                } catch (err) { console.error("Erro ao gravar pedido:", err); }

                // 2. Chamar a API da InfinitePay enviando o customer e billing_address
                const pedido = {
                    order_nsu: orderNsu,
                    customer: clienteCompleto,
                    items: [ { quantity: 1, price: precoCentavos, description: `Elora Parfums: ${produto.marca} - ${produto.nome}` } ]
                };

                try {
                    const resposta = await fetch('/api/checkout', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pedido)
                    });
                    const dados = await resposta.json();
                    if (dados.url || dados.checkout_url) window.location.href = dados.url || dados.checkout_url;
                    else setLoading(false);
                } catch (erro) {
                    alert("Erro ao conectar com o checkout. Tente novamente.");
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-12 lg:py-20 grid grid-cols-1 lg:grid-cols-2 gap-16 animate-fade-in">
                    <div>
                        <button onClick={voltarParaLoja} className="flex items-center gap-2 text-slate-500 hover:text-elora-gold mb-8 text-sm uppercase tracking-widest font-semibold transition-colors">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i> Voltar
                        </button>

                        {/* Card do Usuário Logado */}
                        <div className="bg-emerald-50/50 border border-emerald-100 p-5 rounded-xl mb-8 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-100 p-2.5 rounded-full text-emerald-700">
                                    <i data-lucide="shield-check" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-500 font-medium">Comprando como:</p>
                                    <p className="text-sm font-bold text-slate-900">{user.nome} ({user.email})</p>
                                </div>
                            </div>
                        </div>

                        <form onSubmit={processarPedido} className="space-y-8">
                            <div className="bg-white border border-slate-100 p-8 shadow-xl rounded-xl">
                                <h3 className="text-xl font-serif text-slate-900 mb-6 flex items-center gap-3">
                                    <i data-lucide="map-pin" className="text-elora-gold w-5 h-5"></i> Endereço de Entrega
                                </h3>
                                
                                <div className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">CEP *</label>
                                            <input name="cep" value={endereco.cep} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="00000-000" />
                                        </div>
                                        <div className="sm:col-span-2">
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Rua / Avenida *</label>
                                            <input name="rua" value={endereco.rua} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="Nome da rua" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Número *</label>
                                            <input name="numero" value={endereco.numero} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="123" />
                                        </div>
                                        <div className="sm:col-span-2">
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Complemento</label>
                                            <input name="complemento" value={endereco.complemento} onChange={handleChange} className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" placeholder="Apto, Bloco, etc." />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Bairro *</label>
                                            <input name="bairro" value={endereco.bairro} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Cidade *</label>
                                            <input name="cidade" value={endereco.cidade} onChange={handleChange} required className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-semibold">Estado *</label>
                                            <input name="uf" value={endereco.uf} onChange={handleChange} required maxLength="2" className="w-full bg-slate-50 border border-slate-200 p-3.5 text-slate-900 text-sm outline-none focus:border-elora-gold rounded-md uppercase" placeholder="SP" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-elora-gold text-white py-5 text-sm font-bold uppercase tracking-widest hover:bg-slate-900 transition-colors rounded-md shadow-xl shadow-elora-gold/20 flex items-center justify-center gap-3">
                                {loading ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> : 'Confirmar Endereço e Pagar Seguro'}
                            </button>
                        </form>
                    </div>
                    
                    <div className="bg-white border border-slate-100 p-8 md:p-12 h-fit shadow-2xl rounded-xl relative overflow-hidden sticky top-28">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-elora-gold/5 rounded-full blur-3xl"></div>

                        <h3 className="text-2xl font-serif text-slate-900 mb-8 relative z-10">Resumo do Pedido</h3>
                        
                        <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-lg flex items-center gap-3 mb-6 relative z-10">
                            <i data-lucide="sparkles" className="w-5 h-5 text-emerald-600 flex-shrink-0"></i>
                            <p className="text-xs text-emerald-800 font-medium">
                                <strong>Ganhe 5% OFF no PIX!</strong> O desconto extra é aplicado automaticamente na etapa final de pagamento.
                            </p>
                        </div>

                        <div className="flex items-center gap-6 mb-8 pb-8 border-b border-slate-100 relative z-10">
                            <img src={produto.imagem} className="w-24 h-24 object-cover rounded-md shadow-md" alt={produto.nome} />
                            <div>
                                <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest block mb-1">{produto.marca}</span>
                                <p className="text-slate-900 text-lg font-serif mb-1">{produto.nome}</p>
                                <p className="text-slate-500 font-medium text-sm">R$ {produto.preco.toFixed(2)}</p>
                            </div>
                        </div>

                        <div className="space-y-4 text-sm text-slate-600 relative z-10">
                            <div className="flex justify-between">
                                <span>Subtotal</span>
                                <span>R$ {produto.preco.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between">
                                <span>Frete Expresso</span>
                                <span className="text-emerald-500 font-semibold">Grátis</span>
                            </div>
                            <div className="flex justify-between text-slate-500">
                                <span>Pagamento</span>
                                <span>PIX (5% OFF) ou 10x s/ juros</span>
                            </div>
                        </div>

                        <div className="flex justify-between text-slate-900 font-serif text-3xl mt-8 pt-8 border-t border-slate-100 relative z-10">
                            <span>Total</span>
                            <span className="text-elora-gold">R$ {produto.preco.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE PRINCIPAL APP ---
        function App() {
            const [view, setView] = useState('store');
            const [quizOpen, setQuizOpen] = useState(false);
            const [authModalOpen, setAuthModalOpen] = useState(false);
            const [authNotice, setAuthNotice] = useState('');
            const [produtos, setProdutos] = useState([]); 
            const [produtoCheckout, setProdutoCheckout] = useState(null);
            
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('elora_user');
                return saved ? JSON.parse(saved) : null;
            });

            useEffect(() => {
                const carregarPerfumes = async () => {
                    setTimeout(async () => {
                        if (window.db && window.collection && window.getDocs) {
                            try {
                                const qs = await window.getDocs(window.collection(window.db, "perfumes"));
                                const lista = [];
                                qs.forEach(doc => lista.push({ id: doc.id, ...doc.data() }));
                                setProdutos(lista.length > 0 ? lista : produtosIniciais);
                            } catch (e) { setProdutos(produtosIniciais); }
                        } else setProdutos(produtosIniciais);
                    }, 800);
                };
                carregarPerfumes();
            }, []);

            useEffect(() => { setTimeout(() => lucide.createIcons(), 50); }, [view, quizOpen, authModalOpen, produtos, user]);

            const logout = () => {
                localStorage.removeItem('elora_user');
                setUser(null);
                setView('store');
            };

            // Regra principal de Compra: se não estiver logado, EXIGE criar conta primeiro!
            const handleComprar = (produto) => {
                setProdutoCheckout(produto);
                if (!user) {
                    setAuthNotice('Crie sua conta ou faça login para continuar a compra.');
                    setAuthModalOpen(true);
                } else {
                    setView('checkout');
                    window.scrollTo(0,0);
                }
            };

            const handleAuthSuccess = (loggedUser) => {
                setUser(loggedUser);
                setAuthModalOpen(false);
                setAuthNotice('');

                // Se tinha um produto selecionado, vai direto para o checkout de endereço
                if (produtoCheckout) {
                    setView('checkout');
                    window.scrollTo(0,0);
                } else {
                    setView('account');
                }
            };

            return (
                <div className="min-h-screen text-slate-900 font-sans flex flex-col">
                    <header className="bg-white/95 backdrop-blur-md border-b border-slate-200 py-6 sticky top-0 z-50 shadow-sm flex items-center min-h-[90px]">
                        <div className="max-w-7xl w-full mx-auto px-4 flex justify-between items-center relative">
                            {/* Lado Esquerdo Limpo sem "Vitrine" */}
                            <div className="w-1/3"></div>

                            {/* Logo Centralizada */}
                            <div className="text-4xl md:text-5xl font-cinzel tracking-[0.15em] uppercase text-elora-gold absolute left-1/2 -translate-x-1/2 cursor-pointer flex flex-col items-center leading-none mt-2" onClick={() => setView('store')}>
                                <span className="font-semibold drop-shadow-sm pb-1">ELORA</span>
                                <span className="text-[10px] tracking-[0.4em] font-sans text-slate-900 font-medium">PARFUMS</span>
                            </div>

                            {/* Menu da Conta */}
                            <div className="flex items-center justify-end space-x-6 w-1/3">
                                <button onClick={() => {
                                    if (user) setView('account');
                                    else {
                                        setAuthNotice('');
                                        setAuthModalOpen(true);
                                    }
                                }} className={`flex items-center gap-2 text-[11px] font-bold uppercase tracking-[0.2em] transition-colors py-2 ${view === 'account' ? 'text-elora-gold' : 'text-slate-500 hover:text-slate-900'}`}>
                                    <i data-lucide="user" className="w-5 h-5"></i>
                                    <span className="hidden sm:inline">{user ? 'Minha Conta' : 'Entrar'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'account' && user && <CustomerAccount user={user} logout={logout} voltar={() => setView('store')} />}
                        {view === 'checkout' && produtoCheckout && user && <Checkout produto={produtoCheckout} user={user} voltarParaLoja={() => setView('store')} />}
                        
                        {view === 'store' && (
                            <div className="animate-fade-in">
                                <section className="relative h-[80vh] w-full flex items-center justify-center overflow-hidden bg-slate-100">
                                    <img src="./banner-promo.jpeg" className="absolute inset-0 w-full h-full object-cover z-0" alt="Banner Promoção" />
                                    <div className="absolute inset-0 bg-white/70 z-10"></div>
                                    <div className="relative z-20 text-center px-6 mt-16 mx-4 max-w-4xl">
                                        <h1 className="text-6xl md:text-8xl font-serif mb-6 text-slate-900 tracking-tight drop-shadow-xl">A Essência do <span className="text-elora-gold">Oriente</span>.</h1>
                                        <button onClick={() => setQuizOpen(true)} className="bg-elora-gold text-white px-8 md:px-12 py-5 text-sm font-bold uppercase tracking-widest hover:bg-slate-900 transition-all shadow-xl flex items-center mx-auto gap-3 rounded-md hover:scale-105">
                                            <i data-lucide="flask-conical" className="w-5 h-5"></i> Encontrar Minha Fragrância
                                        </button>
                                    </div>
                                </section>

                                <section className="max-w-7xl mx-auto px-4 py-24">
                                    <h2 className="text-4xl md:text-5xl font-serif mb-16 text-slate-900 text-center">Catálogo Exclusivo</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                        {produtos.map((produto) => (
                                            <div key={produto.id} className="group flex flex-col bg-white border border-slate-100 shadow-lg hover:shadow-2xl hover:border-elora-gold/30 transition-all duration-500 p-5 rounded-xl">
                                                <div className="relative aspect-[4/5] bg-slate-50 overflow-hidden flex items-center justify-center p-6 mb-6 rounded-md">
                                                    {produto.tag && <div className="absolute top-3 left-3 bg-elora-gold text-white text-[9px] font-bold uppercase tracking-widest px-3 py-1.5 z-10 rounded-sm shadow-sm">{produto.tag}</div>}
                                                    <img src={produto.imagem} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 rounded-md shadow-sm" alt={produto.nome} />
                                                </div>
                                                <div className="text-center mt-auto flex flex-col items-center">
                                                    <span className="text-elora-gold text-[10px] font-bold uppercase tracking-widest mb-2 block">{produto.marca}</span>
                                                    <h3 className="text-slate-900 text-xl font-serif mb-2 group-hover:text-elora-gold transition-colors">{produto.nome}</h3>
                                                    <p className="text-slate-600 mb-6 font-medium text-lg">R$ {Number(produto.preco).toFixed(2)}</p>
                                                    
                                                    {/* Clique em COMPRAR aciona a verificação de conta */}
                                                    <button onClick={() => handleComprar(produto)} className="w-full border border-slate-200 text-slate-700 py-4 text-xs font-bold uppercase tracking-widest hover:bg-elora-gold hover:border-elora-gold hover:text-white transition-all rounded-md flex justify-center items-center gap-2">
                                                        <i data-lucide="shopping-bag" className="w-4 h-4"></i> Comprar
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    <footer className="bg-white border-t border-slate-200 py-12 mt-auto text-center">
                        <div className="text-3xl font-cinzel tracking-[0.2em] uppercase text-elora-gold mb-6 leading-none">
                            ELORA <span className="text-slate-900 text-[10px] font-sans tracking-[0.4em] block mt-3">PARFUMS</span>
                        </div>
                        <p className="text-slate-500 text-sm tracking-wide mt-4">Todos os direitos reservados &copy; 2026.</p>
                    </footer>

                    {quizOpen && <QuizModal onClose={() => setQuizOpen(false)} produtos={produtos} irParaCheckout={(p) => handleComprar(p)} />}
                    {authModalOpen && <AuthModal onClose={() => setAuthModalOpen(false)} onSuccess={handleAuthSuccess} mensagemExtra={authNotice} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
